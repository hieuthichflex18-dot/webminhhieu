<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GHI ĐÔNG // QUANTUM CORE 4.0 ULTRA</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&family=JetBrains+Mono:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-base: #030712;
            --panel-bg: rgba(10, 15, 30, 0.75);
            --border-subtle: rgba(56, 189, 248, 0.15);
            --neon-cyan: #00ffd1;
            --neon-violet: #a855f7;
            --neon-crimson: #ff2a6d;
            --neon-blue: #38bdf8;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: var(--bg-base);
            background-image: 
                radial-gradient(circle at 50% -20%, rgba(168, 85, 247, 0.2) 0%, transparent 50%),
                radial-gradient(circle at 100% 100%, rgba(0, 255, 209, 0.1) 0%, transparent 50%),
                linear-gradient(rgba(56, 189, 248, 0.015) 1px, transparent 1px),
                linear-gradient(90deg, rgba(56, 189, 248, 0.015) 1px, transparent 1px);
            background-size: 100% 100%, 100% 100%, 32px 32px, 32px 32px;
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 24px 16px;
            overflow-x: hidden;
        }

        /* Các hạt năng lượng bay nhẹ nền */
        .ambient-particles {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none;
            z-index: 0;
        }
        .particle {
            position: absolute;
            width: 3px; height: 3px;
            background: var(--neon-cyan);
            box-shadow: 0 0 10px var(--neon-cyan);
            border-radius: 50%;
            animation: floatUp 10s infinite linear;
        }
        @keyframes floatUp {
            0% { transform: translateY(105vh) scale(0.2); opacity: 0; }
            50% { opacity: 0.6; }
            100% { transform: translateY(-5vh) scale(1.4); opacity: 0; }
        }

        .quantum-shell {
            width: 100%;
            max-width: 640px;
            background: var(--panel-bg);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            border-radius: 32px;
            border: 1px solid var(--border-subtle);
            box-shadow: 0 30px 100px rgba(0, 0, 0, 0.8), inset 0 1px 0 rgba(255, 255, 255, 0.1);
            position: relative;
            z-index: 1;
            overflow: hidden;
            transition: all 0.6s cubic-bezier(0.16, 1, 0.3, 1);
            animation: shellIntro 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        @keyframes shellIntro {
            from { opacity: 0; transform: translateY(25px) scale(0.97); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }

        /* Hiệu ứng trạng thái khi ra Tài / Xỉu */
        .quantum-shell.mode-tai {
            box-shadow: 0 40px 120px rgba(0, 0, 0, 0.9), 0 0 50px rgba(0, 255, 209, 0.25), inset 0 0 20px rgba(0, 255, 209, 0.08);
            border-color: rgba(0, 255, 209, 0.6);
        }
        .quantum-shell.mode-xiu {
            box-shadow: 0 40px 120px rgba(0, 0, 0, 0.9), 0 0 50px rgba(255, 42, 109, 0.25), inset 0 0 20px rgba(255, 42, 109, 0.08);
            border-color: rgba(255, 42, 109, 0.6);
        }

        /* Thanh năng lượng chạy đỉnh khung */
        .quantum-shell::before {
            content: '';
            position: absolute;
            top: 0; left: -100%; right: -100%;
            height: 3px;
            background: linear-gradient(90deg, transparent, var(--neon-cyan), var(--neon-violet), var(--neon-cyan), transparent);
            animation: scanLine 6s linear infinite;
        }
        @keyframes scanLine {
            0% { transform: translateX(0%); }
            100% { transform: translateX(50%); }
        }

        .header-panel {
            padding: 24px 32px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border-subtle);
            background: rgba(3, 7, 18, 0.4);
        }
        .brand-name {
            font-family: 'JetBrains Mono', monospace;
            font-size: 1.1rem;
            font-weight: 700;
            letter-spacing: 2px;
            background: linear-gradient(135deg, var(--neon-cyan), var(--neon-blue));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .core-status {
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.7rem;
            background: rgba(0, 255, 209, 0.08);
            border: 1px solid rgba(0, 255, 209, 0.3);
            color: var(--neon-cyan);
            padding: 6px 14px;
            border-radius: 20px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .status-dot {
            width: 7px; height: 7px;
            background: var(--neon-cyan);
            border-radius: 50%;
            box-shadow: 0 0 10px var(--neon-cyan);
            animation: pulseGlow 1.5s infinite alternate;
        }
        @keyframes pulseGlow {
            0% { transform: scale(0.9); opacity: 0.4; }
            100% { transform: scale(1.2); opacity: 1; box-shadow: 0 0 15px var(--neon-cyan); }
        }

        .body-panel { padding: 32px; }

        .matrix-tabs {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 6px;
            background: rgba(3, 7, 18, 0.6);
            padding: 6px;
            border-radius: 16px;
            border: 1px solid var(--border-subtle);
            margin-bottom: 24px;
        }
        .tab-btn {
            background: transparent;
            border: none;
            color: var(--text-muted);
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.75rem;
            font-weight: 700;
            padding: 12px;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
            letter-spacing: 1px;
        }
        .tab-btn.active {
            background: linear-gradient(135deg, var(--neon-cyan), #00b4d8);
            color: #030712;
            box-shadow: 0 0 20px rgba(0, 255, 209, 0.35);
        }

        .tab-content { display: none; }
        .tab-content.active { display: block; animation: tabFade 0.4s cubic-bezier(0.16, 1, 0.3, 1); }
        @keyframes tabFade { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }

        .input-group { margin-bottom: 20px; }
        .label-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }
        .input-title {
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.7rem;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .action-cluster { display: flex; gap: 6px; }
        .mini-btn {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--border-subtle);
            color: var(--text-muted);
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.65rem;
            font-weight: 700;
            padding: 5px 12px;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.25s;
        }
        .mini-btn:hover {
            background: rgba(0, 255, 209, 0.12);
            color: var(--neon-cyan);
            border-color: var(--neon-cyan);
        }

        .input-field-wrap { position: relative; }
        input[type="text"] {
            width: 100%;
            background: rgba(3, 7, 18, 0.85);
            border: 1px solid var(--border-subtle);
            color: var(--neon-cyan);
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.9rem;
            padding: 16px 20px;
            border-radius: 14px;
            outline: none;
            box-sizing: border-box;
            box-shadow: inset 0 2px 6px rgba(0,0,0,0.8);
            transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
        }
        input[type="text"]:focus {
            border-color: var(--neon-cyan);
            box-shadow: 0 0 20px rgba(0, 255, 209, 0.2), inset 0 2px 6px rgba(0,0,0,0.8);
        }

        .history-stream {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-top: 16px;
            overflow-x: auto;
            padding-bottom: 4px;
        }
        .history-stream::-webkit-scrollbar { height: 3px; }
        .history-stream::-webkit-scrollbar-thumb { background: var(--border-subtle); border-radius: 4px; }

        .history-title {
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.65rem;
            color: var(--text-muted);
            text-transform: uppercase;
            white-space: nowrap;
        }
        .history-pill {
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.65rem;
            font-weight: 700;
            padding: 4px 10px;
            border-radius: 8px;
            white-space: nowrap;
        }
        .pill-tai { background: rgba(0, 255, 209, 0.1); color: var(--neon-cyan); border: 1px solid rgba(0, 255, 209, 0.3); }
        .pill-xiu { background: rgba(255, 42, 109, 0.1); color: var(--neon-crimson); border: 1px solid rgba(255, 42, 109, 0.3); }

        .error-alert {
            background: rgba(255, 42, 109, 0.1);
            border: 1px solid rgba(255, 42, 109, 0.35);
            color: var(--neon-crimson);
            font-size: 0.75rem;
            font-family: 'JetBrains Mono', monospace;
            padding: 12px;
            border-radius: 10px;
            text-align: center;
            margin-top: 16px;
            display: none;
        }

        .processing-box {
            margin-top: 20px;
            background: rgba(3, 7, 18, 0.8);
            border: 1px solid var(--border-subtle);
            border-radius: 18px;
            padding: 30px;
            text-align: center;
            display: none;
        }
        .processing-box.active { display: block; animation: fadeIn 0.3s; }
        .quantum-spinner {
            width: 40px; height: 40px;
            border: 3px solid rgba(0, 255, 209, 0.1);
            border-top-color: var(--neon-cyan);
            border-right-color: var(--neon-violet);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin: 0 auto 12px auto;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        .processing-label {
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.75rem;
            color: var(--neon-cyan);
            letter-spacing: 2px;
        }

        .analysis-output {
            margin-top: 20px;
            background: rgba(3, 7, 18, 0.75);
            border: 1px solid var(--border-subtle);
            border-radius: 20px;
            padding: 26px;
            display: none;
        }
        .analysis-output.active { display: block; animation: slideUp 0.4s cubic-bezier(0.16, 1, 0.3, 1); }
        @keyframes slideUp { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: translateY(0); } }

        .output-heading {
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.65rem;
            color: var(--text-muted);
            text-transform: uppercase;
            text-align: center;
            letter-spacing: 2px;
            margin-bottom: 12px;
        }

        .verdict-badge {
            text-align: center;
            padding: 20px;
            border-radius: 16px;
            font-size: 2.5rem;
            font-weight: 900;
            letter-spacing: 5px;
            font-family: 'JetBrains Mono', monospace;
            margin-bottom: 12px;
        }
        .verdict-tai { background: rgba(0, 255, 209, 0.12); color: var(--neon-cyan); border: 1px solid rgba(0, 255, 209, 0.45); box-shadow: 0 0 30px rgba(0, 255, 209, 0.2); }
        .verdict-xiu { background: rgba(255, 42, 109, 0.12); color: var(--neon-crimson); border: 1px solid rgba(255, 42, 109, 0.45); box-shadow: 0 0 30px rgba(255, 42, 109, 0.2); }

        .score-info {
            text-align: center;
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.85rem;
            color: #cbd5e1;
            margin-bottom: 16px;
        }

        .separator-line { height: 1px; background: var(--border-subtle); margin: 18px 0; }

        .nodes-grid {
            display: flex;
            justify-content: center;
            gap: 14px;
        }
        .node-card {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
        }
        .node-box {
            width: 52px; height: 52px;
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid var(--border-subtle);
            border-radius: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'JetBrains Mono', monospace;
            font-size: 1.3rem;
            font-weight: 700;
            color: #fff;
            box-shadow: inset 0 2px 4px rgba(0,0,0,0.6);
        }
        .node-label {
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.55rem;
            color: var(--text-muted);
            letter-spacing: 1px;
        }

        .extra-metrics {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-top: 16px;
        }
        .metric-cell {
            background: rgba(255, 255, 255, 0.015);
            border: 1px solid var(--border-subtle);
            padding: 10px 14px;
            border-radius: 10px;
            display: flex;
            justify-content: space-between;
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.72rem;
        }
        .metric-cell span:last-child { color: var(--neon-cyan); font-weight: 700; }
    </style>
</head>
<body>

<div class="ambient-particles" id="particlesContainer"></div>

<div class="quantum-shell" id="quantumShell">
    <div class="header-panel">
        <div class="brand-name">GHI ĐÔNG // CORE 4.0</div>
        <div class="core-status">
            <div class="status-dot"></div>
            <span>DETERMINISTIC SYNC</span>
        </div>
    </div>

    <div class="body-panel">
        <div class="matrix-tabs">
            <button class="tab-btn active" onclick="switchMatrixTab('taixiu')">PHÂN TÍCH TÀI XỈU</button>
            <button class="tab-btn" onclick="switchMatrixTab('sicbo')">SICBO MA TRẬN</button>
        </div>

        <!-- TAB TÀI XỈU -->
        <div id="tabPaneTaiXiu" class="tab-content active">
            <div class="input-group">
                <div class="label-row">
                    <span class="input-title">Mã MD5 Quantum Hash</span>
                    <div class="action-cluster">
                        <button type="button" class="mini-btn" onclick="autoPasteAndRun('inputTx')">Dán</button>
                        <button type="button" class="mini-btn" onclick="clearData('inputTx')">Xóa</button>
                    </div>
                </div>
                <div class="input-field-wrap">
                    <input type="text" id="inputTx" placeholder="Dán mã MD5 (32 ký tự)..." autocomplete="off" oninput="checkAutoRun('inputTx', 'taixiu')">
                </div>
            </div>
        </div>

        <!-- TAB SICBO -->
        <div id="tabPaneSicbo" class="tab-content">
            <div class="input-group">
                <div class="label-row">
                    <span class="input-title">Mã MD5 Ma Trận Sâu</span>
                    <div class="action-cluster">
                        <button type="button" class="mini-btn" onclick="autoPasteAndRun('inputSb')">Dán</button>
                        <button type="button" class="mini-btn" onclick="clearData('inputSb')">Xóa</button>
                    </div>
                </div>
                <div class="input-field-wrap">
                    <input type="text" id="inputSb" placeholder="Dán mã MD5 (32 ký tự)..." autocomplete="off" oninput="checkAutoRun('inputSb', 'sicbo')">
                </div>
            </div>
        </div>

        <div class="history-stream" id="historyStream" style="display: none;">
            <span class="history-title">Log:</span>
            <div id="historyList" style="display: flex; gap: 8px;"></div>
        </div>

        <div id="errorAlert" class="error-alert"></div>

        <div id="processingBox" class="processing-box">
            <div class="quantum-spinner"></div>
            <div class="processing-label">ĐANG GIẢI MÃ LƯỢNG TỬ CỐ ĐỊNH...</div>
        </div>

        <div id="analysisOutput" class="analysis-output">
            <div class="output-heading">Trạng thái giải mã tổng thể</div>
            <div id="verdictBadge" class="verdict-badge">-</div>
            <div class="score-info" id="scoreInfoText">Tổng điểm: -</div>

            <div class="separator-line"></div>

            <div class="output-heading">Cấu trúc điểm node giải mã</div>
            <div class="nodes-grid">
                <div class="node-card">
                    <div class="node-box" id="node1">-</div>
                    <div class="node-label">N-01</div>
                </div>
                <div class="node-card">
                    <div class="node-box" id="node2">-</div>
                    <div class="node-label">N-02</div>
                </div>
                <div class="node-card">
                    <div class="node-box" id="node3">-</div>
                    <div class="node-label">N-03</div>
                </div>
            </div>

            <div id="sicboExtraSection" style="display: none;">
                <div class="separator-line"></div>
                <div class="output-heading" style="margin-bottom: 10px;">Ma trận thông số phụ</div>
                <div class="extra-metrics">
                    <div class="metric-cell"><span>Chẵn/Lẻ:</span> <span id="mEvenOdd">-</span></div>
                    <div class="metric-cell"><span>Cửa Cổng:</span> <span id="mGate">-</span></div>
                    <div class="metric-cell"><span>Độ trễ Bit:</span> <span id="mEntropy">-</span></div>
                    <div class="metric-cell"><span>Bão/Đôi:</span> <span id="mTripleState">-</span></div>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
/* Khởi tạo hạt nền chuyển động */
const particlesContainer = document.getElementById('particlesContainer');
for (let i = 0; i < 25; i++) {
    const p = document.createElement('div');
    p.className = 'particle';
    p.style.left = Math.random() * 100 + '%';
    p.style.animationDuration = (Math.random() * 6 + 6) + 's';
    p.style.animationDelay = (Math.random() * 5) + 's';
    particlesContainer.appendChild(p);
}

let executionHistory = [];

async function autoPasteAndRun(elementId) {
    try {
        const text = await navigator.clipboard.readText();
        const cleanText = text.trim();
        const inputEl = document.getElementById(elementId);
        inputEl.value = cleanText;
        
        let mode = elementId === 'inputTx' ? 'taixiu' : 'sicbo';
        checkAutoRun(elementId, mode);
    } catch (err) {
        showError("Không thể truy cập Clipboard. Hãy sử dụng Ctrl + V trực tiếp.");
    }
}

function checkAutoRun(elementId, mode) {
    const val = document.getElementById(elementId).value.trim();
    if (val.length === 32) {
        if (/^[0-9a-fA-F]{32}$/.test(val)) {
            hideError();
            executeQuantumAnalysis(val.toLowerCase(), mode);
        } else {
            showError("Mã MD5 không hợp lệ (Bắt buộc 32 ký tự hệ Hex).");
        }
    } else if (val.length > 0 && val.length < 32) {
        showError("Mã MD5 chưa đủ 32 ký tự...");
    } else {
        hideError();
        document.getElementById('analysisOutput').classList.remove('active');
        document.getElementById('quantumShell').className = "quantum-shell";
    }
}

function clearData(elementId) {
    document.getElementById(elementId).value = '';
    hideError();
    document.getElementById('analysisOutput').classList.remove('active');
    document.getElementById('quantumShell').className = "quantum-shell";
    document.getElementById(elementId).focus();
}

function switchMatrixTab(tabName) {
    document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));
    document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));

    if (tabName === 'taixiu') {
        document.querySelectorAll('.tab-btn')[0].classList.add('active');
        document.getElementById('tabPaneTaiXiu').classList.add('active');
    } else {
        document.querySelectorAll('.tab-btn')[1].classList.add('active');
        document.getElementById('tabPaneSicbo').classList.add('active');
    }
    document.getElementById('analysisOutput').classList.remove('active');
    document.getElementById('processingBox').classList.remove('active');
    hideError();
    document.getElementById('quantumShell').className = "quantum-shell";
}

function showError(msg) {
    const err = document.getElementById('errorAlert');
    err.innerText = msg;
    err.style.display = 'block';
}

function hideError() {
    document.getElementById('errorAlert').style.display = 'none';
}

/* THUẬT TOÁN HASH ĐẶC BIỆT CỐ ĐỊNH (KHÔNG RANDOM, CÂN BẰNG TỶ LỆ) */
function parseQuantumDice(md5, mode) {
    let hashSum = 0;
    for (let i = 0; i < md5.length; i++) {
        hashSum = (hashSum << 5) - hashSum + md5.charCodeAt(i);
        hashSum |= 0;
    }

    let seg = mode === 'sicbo' ? 10 : 8;
    let v1 = parseInt(md5.substring(0, seg), 16);
    let v2 = parseInt(md5.substring(seg, seg * 2), 16);
    let v3 = parseInt(md5.substring(seg * 2, seg * 3), 16);

    let d1 = (Math.abs((v1 ^ hashSum) + 7) % 6) + 1;
    let d2 = (Math.abs((v2 ^ (hashSum >> 2)) + 13) % 6) + 1;
    let d3 = (Math.abs((v3 ^ (hashSum >> 4)) + 19) % 6) + 1;

    if (md5.charCodeAt(15) % 2 === 0) {
        let temp = d1; d1 = d3; d3 = temp;
    }

    return { d1, d2, d3 };
}

function recordHistory(text) {
    executionHistory.unshift(text);
    if (executionHistory.length > 5) executionHistory.pop();

    const stream = document.getElementById('historyStream');
    const list = document.getElementById('historyList');
    stream.style.display = 'flex';

    list.innerHTML = executionHistory.map(item => {
        let isTai = item.includes('TÀI');
        return `<div class="history-pill ${isTai ? 'pill-tai' : 'pill-xiu'}">${item}</div>`;
    }).join('');
}

function executeQuantumAnalysis(md5, mode) {
    document.getElementById('analysisOutput').classList.remove('active');
    document.getElementById('processingBox').classList.add('active');
    document.getElementById('quantumShell').className = "quantum-shell";

    setTimeout(() => {
        document.getElementById('processingBox').classList.remove('active');

        let { d1, d2, d3 } = parseQuantumDice(md5, mode);
        let total = d1 + d2 + d3;
        let isTai = total >= 11;
        let logText = isTai ? `TÀI [${total}]` : `XỈU [${total}]`;

        recordHistory(logText);
        
        const shell = document.getElementById('quantumShell');
        shell.className = isTai ? "quantum-shell mode-tai" : "quantum-shell mode-xiu";

        const badge = document.getElementById('verdictBadge');
        badge.className = isTai ? "verdict-badge verdict-tai" : "verdict-badge verdict-xiu";
        badge.innerText = isTai ? 'TÀI' : 'XỈU';

        document.getElementById('scoreInfoText').innerText = `Tổng điểm phân tích: ${total} Điểm`;
        document.getElementById('node1').innerText = d1;
        document.getElementById('node2').innerText = d2;
        document.getElementById('node3').innerText = d3;

        if (mode === 'sicbo') {
            document.getElementById('sicboExtraSection').style.display = 'block';
            let isOdd = total % 2 !== 0;
            let isTriple = (d1 === d2 && d2 === d3);
            document.getElementById('mEvenOdd').innerText = isOdd ? "LẺ" : "CHẴN";
            document.getElementById('mGate').innerText = total <= 10 ? "Xỉu Cổng" : "Tài Cổng";
            document.getElementById('mEntropy').innerText = (parseInt(md5.substring(0, 2), 16) % 12 + 88).toFixed(1) + "%";
            document.getElementById('mTripleState').innerText = isTriple ? `BÃO (${d1})` : "Ổn định";
            document.getElementById('mTripleState').style.color = isTriple ? "var(--neon-crimson)" : "var(--neon-cyan)";
        } else {
            document.getElementById('sicboExtraSection').style.display = 'none';
        }

        document.getElementById('analysisOutput').classList.add('active');
    }, 500);
}
</script>

</body>
</html>
