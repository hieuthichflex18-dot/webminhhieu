<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>LC79 · HŨ + MD5 + Game</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      height: 100%;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, sans-serif;
      background: #0a0a10;
      color: #eee;
    }

    .wrap {
      display: flex;
      height: 100%;
      width: 100%;
    }

    /* ===== BÊN TRÁI: 2 khung HŨ + MD5 ===== */
    .left {
      width: 300px;
      min-width: 260px;
      max-width: 340px;
      background: #0e0e16;
      border-right: 1px solid #222;
      display: flex;
      flex-direction: column;
      padding: 10px;
      gap: 10px;
      overflow-y: auto;
    }

    .card {
      background: #fff;
      border-radius: 14px;
      padding: 12px 14px;
      color: #222;
      text-align: center;
      box-shadow: 0 4px 18px #0006;
      flex-shrink: 0;
    }
    .card .label {
      font-size: 12px;
      font-weight: 800;
      letter-spacing: 1.5px;
      margin-bottom: 4px;
    }
    .card .label.hu { color: #ff9f43; }
    .card .label.md5 { color: #00b894; }

    .card .phien {
      font-size: 13px;
      font-weight: 700;
      color: #555;
      margin-bottom: 8px;
    }

    .dots {
      display: flex;
      justify-content: center;
      gap: 14px;
      margin-bottom: 8px;
    }
    .dot {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      opacity: 0.3;
      transition: all 0.3s;
    }
    .dot.g { background: #b8f0d0; }
    .dot.r { background: #f5b0b8; }
    .dot.g.on {
      background: #2ee59d;
      opacity: 1;
      box-shadow: 0 0 14px #2ee59d99;
      animation: blink 1.15s ease-in-out infinite;
    }
    .dot.r.on {
      background: #ff4d6d;
      opacity: 1;
      box-shadow: 0 0 14px #ff4d6d99;
      animation: blink 1.15s ease-in-out infinite;
    }
    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.65; }
    }

    .pred {
      font-size: 14px;
      font-weight: 700;
      line-height: 1.3;
    }
    .pred .pct {
      font-size: 18px;
      font-weight: 900;
    }
    .pred.xiu .pct { color: #00a86b; }
    .pred.tai .pct { color: #e63950; }

    .meta {
      margin-top: 6px;
      font-size: 11px;
      color: #777;
    }

    .status {
      font-size: 10px;
      color: #666;
      text-align: center;
      margin-top: 4px;
    }

    /* ===== BÊN PHẢI: GAME ===== */
    .right {
      flex: 1;
      position: relative;
      background: #111;
    }
    .right iframe {
      width: 100%;
      height: 100%;
      border: none;
    }
    .fallback {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #0e0e16;
      text-align: center;
      padding: 20px;
      display: none;
    }
    .fallback a {
      display: inline-block;
      margin-top: 14px;
      padding: 12px 24px;
      background: linear-gradient(135deg, #00e5b0, #00b4ff);
      color: #000;
      font-weight: 800;
      border-radius: 10px;
      text-decoration: none;
    }

    /* Mobile: xếp dọc */
    @media (max-width: 700px) {
      .wrap { flex-direction: column; }
      .left {
        width: 100%;
        max-width: none;
        flex-direction: row;
        overflow-x: auto;
        border-right: none;
        border-bottom: 1px solid #222;
        padding: 8px;
        gap: 8px;
      }
      .card {
        min-width: 200px;
        flex: 1;
      }
      .right { min-height: 60vh; }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <!-- TRÁI: 2 khung -->
    <div class="left">
      <!-- HŨ -->
      <div class="card">
        <div class="label hu">HŨ</div>
        <div class="phien" id="phHu">Phiên —</div>
        <div class="dots">
          <div class="dot g" id="gHu"></div>
          <div class="dot r" id="rHu"></div>
        </div>
        <div class="pred" id="pHu">Đang tải...</div>
        <div class="meta" id="mHu">—</div>
        <div class="status" id="sHu">—</div>
      </div>

      <!-- MD5 -->
      <div class="card">
        <div class="label md5">MD5</div>
        <div class="phien" id="phMd5">Phiên —</div>
        <div class="dots">
          <div class="dot g" id="gMd5"></div>
          <div class="dot r" id="rMd5"></div>
        </div>
        <div class="pred" id="pMd5">Đang tải...</div>
        <div class="meta" id="mMd5">—</div>
        <div class="status" id="sMd5">—</div>
      </div>
    </div>

    <!-- PHẢI: GAME -->
    <div class="right">
      <iframe id="gameFrame" src="https://lc79b.bet" allowfullscreen></iframe>
      <div class="fallback" id="fallback">
        <div style="font-size:15px;color:#aaa">Game chặn iframe</div>
        <a href="https://lc79b.bet" target="_blank">Mở game LC79 ↗</a>
      </div>
    </div>
  </div>

<script>
const APIS = {
  hu:  'https://wtx.tele68.com/v1/tx/sessions?cp=R&cl=R&pf=web&at=5bd771bd28adc628097d99d6ecf80c62',
  md5: 'https://wtxmd52.tele68.com/v1/txmd5/sessions?cp=R&cl=R&pf=web&at=5bd771bd28adc628097d99d6ecf80c62'
};

function analyze(list) {
  if (!list || list.length < 8) return { guess: null, pct: 50, reason: '...' };
  const res = list.map(x => x.resultTruyenThong);
  const last = res[0];
  let st = 1;
  for (let i = 1; i < res.length; i++) {
    if (res[i] === last) st++; else break;
  }
  let is11 = true;
  for (let i = 0; i < 5; i++) {
    if (res[i] === res[i+1]) { is11 = false; break; }
  }
  const is22 = res[0]===res[1] && res[2]===res[3] && res[0]!==res[2];
  const t10 = res.slice(0,10).filter(x => x==='TAI').length;
  const t15 = res.slice(0,15).filter(x => x==='TAI').length;

  let guess, pct, reason;
  if (st >= 5) { guess = last==='TAI'?'XỈU':'TÀI'; pct = 68+Math.min(st-5,4)*3; reason = 'Bệt '+st; }
  else if (st === 4) { guess = last==='TAI'?'XỈU':'TÀI'; pct = 64; reason = 'Bệt 4'; }
  else if (st === 3) { guess = last==='TAI'?'XỈU':'TÀI'; pct = 58; reason = 'Bệt 3'; }
  else if (is11) { guess = last==='TAI'?'XỈU':'TÀI'; pct = 62; reason = '1-1'; }
  else if (is22) { guess = last; pct = 60; reason = '2-2'; }
  else if (Math.abs(t15-(15-t15)) >= 6) { guess = t15>8?'XỈU':'TÀI'; pct = 61; reason = 'Hồi quy'; }
  else if (t10 >= 6) { guess = 'TÀI'; pct = 54+(t10-6)*3; reason = t10+'T'; }
  else if (t10 <= 4) { guess = 'XỈU'; pct = 54+(4-t10)*3; reason = (10-t10)+'X'; }
  else { guess = last==='TAI'?'XỈU':'TÀI'; pct = 52; reason = 'Cân'; }
  pct = Math.min(78, Math.max(51, pct));
  return { guess, pct, reason };
}

async function load(mode, ids) {
  try {
    const res = await fetch(APIS[mode], { cache: 'no-store' });
    const data = await res.json();
    const list = data.list || [];
    const L = list[0];
    if (!L) return;

    document.getElementById(ids.ph).textContent = 'Phiên #' + L.id;
    const isT = L.resultTruyenThong === 'TAI';
    const a = analyze(list);

    const gEl = document.getElementById(ids.g);
    const rEl = document.getElementById(ids.r);
    const pEl = document.getElementById(ids.p);
    gEl.classList.remove('on');
    rEl.classList.remove('on');

    if (a.guess === 'XỈU') {
      gEl.classList.add('on');
      pEl.className = 'pred xiu';
      pEl.innerHTML = 'Dự Đoán <b>Xỉu</b><br><span class="pct">' + a.pct + '%</span>';
    } else if (a.guess === 'TÀI') {
      rEl.classList.add('on');
      pEl.className = 'pred tai';
      pEl.innerHTML = 'Dự Đoán <b>Tài</b><br><span class="pct">' + a.pct + '%</span>';
    }

    document.getElementById(ids.m).textContent = (isT ? 'TÀI' : 'XỈU') + ' · ' + a.reason;
    document.getElementById(ids.s).textContent = 'Tự cập nhật';
  } catch (e) {
    document.getElementById(ids.p).textContent = 'Lỗi kết nối';
  }
}

function tick() {
  load('hu',  { ph:'phHu',  g:'gHu',  r:'rHu',  p:'pHu',  m:'mHu',  s:'sHu'  });
  load('md5', { ph:'phMd5', g:'gMd5', r:'rMd5', p:'pMd5', m:'mMd5', s:'sMd5' });
}

tick();
setInterval(tick, 6000);

// Kiểm tra iframe bị chặn
setTimeout(() => {
  try {
    const f = document.getElementById('gameFrame');
    // Nếu load được thì thôi, không thì hiện fallback
  } catch(e) {}
}, 3000);
</script>
</body>
</html>
