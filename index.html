<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>TELEGRAM @frozew</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body, html {
      height: 100%;
      overflow: hidden;
      font-family: 'Segoe UI', 'Inter', system-ui, -apple-system, sans-serif;
      background: #050510;
      -webkit-tap-highlight-color: transparent;
    }

    /* Nền động */
    .bg-glow {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 0;
      background: 
        radial-gradient(circle at 20% 30%, rgba(0, 255, 213, 0.06) 0%, transparent 50%),
        radial-gradient(circle at 80% 70%, rgba(180, 130, 255, 0.05) 0%, transparent 50%),
        radial-gradient(circle at 40% 80%, rgba(255, 45, 149, 0.04) 0%, transparent 50%);
      animation: bgMove 15s ease-in-out infinite alternate;
    }

    @keyframes bgMove {
      0% { transform: scale(1) rotate(0deg); opacity: 0.7; }
      100% { transform: scale(1.05) rotate(2deg); opacity: 1; }
    }

    .particles {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 0;
    }

    .particle {
      position: absolute;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.7);
      filter: blur(1.5px);
      animation: float 12s linear infinite;
      opacity: 0;
    }

    @keyframes float {
      0% { transform: translateY(105vh) scale(0); opacity: 0; }
      10% { opacity: 0.8; }
      90% { opacity: 0.2; }
      100% { transform: translateY(-10vh) scale(1.2); opacity: 0; }
    }

    iframe {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      border: none;
      z-index: 1;
    }

    /* Nút nổi AI */
    .bubble {
      position: fixed;
      top: 120px;
      left: 20px;
      width: 60px;
      height: 60px;
      border-radius: 50%;
      background: rgba(0, 0, 0, 0.35);
      backdrop-filter: blur(20px) saturate(180%);
      -webkit-backdrop-filter: blur(20px) saturate(180%);
      border: 1.5px solid rgba(255, 255, 255, 0.3);
      box-shadow: 0 0 30px rgba(0, 255, 213, 0.5), 0 10px 30px rgba(0,0,0,0.5), inset 0 0 20px rgba(255,255,255,0.15);
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-weight: 700;
      font-size: 15px;
      letter-spacing: 1px;
      z-index: 9999;
      cursor: pointer;
      transition: transform 0.25s ease, box-shadow 0.3s;
      animation: pulse 3s ease-in-out infinite;
      user-select: none;
    }

    .bubble:active {
      transform: scale(0.92);
      transition: 0.1s;
    }

    @keyframes pulse {
      0%, 100% { box-shadow: 0 0 30px rgba(0, 255, 213, 0.5), 0 10px 30px rgba(0,0,0,0.5); }
      50% { box-shadow: 0 0 55px rgba(0, 255, 213, 0.8), 0 15px 40px rgba(0,0,0,0.6); }
    }

    /* Menu trong suốt – không viền LED, viền mỏng nhẹ */
    .menu {
      position: fixed;
      top: 150px;
      left: 20px;
      width: 275px;
      background: transparent;
      backdrop-filter: none;
      -webkit-backdrop-filter: none;
      border-radius: 24px;
      border: 1px solid rgba(255, 255, 255, 0.15);
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
      padding: 18px 16px;
      color: white;
      display: none;
      z-index: 9998;
      animation: fadeSlideIn 0.4s cubic-bezier(0.2, 0.9, 0.3, 1);
      transition: opacity 0.3s;
    }

    @keyframes fadeSlideIn {
      from { opacity: 0; transform: translateY(-20px) scale(0.94); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }

    .title {
      text-align: center;
      font-weight: 700;
      font-size: 18px;
      letter-spacing: 0.5px;
      background: linear-gradient(135deg, #00ffd5, #b482ff, #ff2d95, #00ff88);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      margin-bottom: 14px;
      filter: drop-shadow(0 0 10px rgba(0,255,213,0.5));
    }

    .input-md5 {
      width: 100%;
      padding: 11px 14px;
      border-radius: 16px;
      border: 1px solid rgba(255, 255, 255, 0.3);
      background: rgba(0, 0, 0, 0.25);
      backdrop-filter: blur(5px);
      -webkit-backdrop-filter: blur(5px);
      color: #00ffd5;
      font-weight: 600;
      font-size: 13px;
      outline: none;
      transition: 0.3s;
      box-shadow: inset 0 2px 8px rgba(0,0,0,0.3);
      margin-bottom: 8px;
    }

    .input-md5:focus {
      border-color: #00ffd5;
      box-shadow: 0 0 20px rgba(0,255,213,0.4), inset 0 2px 8px rgba(0,0,0,0.5);
      background: rgba(0, 0, 0, 0.4);
    }

    .input-md5::placeholder {
      color: rgba(255,255,255,0.5);
      font-weight: 400;
    }

    .btn {
      width: 100%;
      padding: 13px;
      margin-top: 10px;
      border: none;
      border-radius: 16px;
      font-weight: 700;
      font-size: 14px;
      letter-spacing: 0.6px;
      cursor: pointer;
      transition: all 0.25s ease;
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      color: white;
      text-transform: uppercase;
      position: relative;
      overflow: hidden;
    }

    .btn::after {
      content: '';
      position: absolute;
      top: 50%; left: 50%;
      width: 0; height: 0;
      border-radius: 50%;
      background: rgba(255,255,255,0.25);
      transform: translate(-50%, -50%);
      transition: width 0.5s, height 0.5s;
    }

    .btn:active::after {
      width: 300px; height: 300px;
    }

    .btn-predict {
      background: linear-gradient(135deg, #00c853, #00e676);
      box-shadow: 0 0 20px rgba(0,255,136,0.5);
      border: 1px solid rgba(255,255,255,0.3);
      animation: glowGreen 2s ease-in-out infinite;
    }

    @keyframes glowGreen {
      0%, 100% { box-shadow: 0 0 20px rgba(0,255,136,0.5); }
      50% { box-shadow: 0 0 40px rgba(0,255,136,0.8); }
    }

    .btn-correct {
      background: linear-gradient(135deg, #009688, #00c853);
      box-shadow: 0 0 15px rgba(0,200,83,0.5);
    }
    .btn-wrong {
      background: linear-gradient(135deg, #c62828, #ff1744);
      box-shadow: 0 0 15px rgba(255,23,68,0.5);
    }

    .btn:hover {
      transform: translateY(-2px);
      filter: brightness(1.15);
    }
    .btn:active {
      transform: translateY(1px);
      filter: brightness(0.9);
      transition: 0.05s;
    }

    .result-box {
      text-align: center;
      padding: 16px;
      border-radius: 18px;
      font-size: 26px;
      font-weight: 800;
      margin: 12px 0 5px;
      letter-spacing: 1px;
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      border: 1px solid rgba(255,255,255,0.25);
      transition: 0.3s;
    }

    .tai {
      background: rgba(0, 200, 83, 0.25);
      box-shadow: 0 0 35px rgba(0,255,136,0.7);
      color: #e0ffe0;
    }
    .xiu {
      background: rgba(213, 0, 0, 0.25);
      box-shadow: 0 0 35px rgba(255,59,92,0.7);
      color: #ffe0e0;
    }

    .confidence {
      font-size: 13px;
      text-align: center;
      color: #ccc;
      margin-bottom: 10px;
      font-weight: 500;
    }

    .toggle-row {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      margin: 8px 0;
      font-size: 13px;
      color: #ddd;
      font-weight: 500;
    }

    .switch {
      position: relative;
      display: inline-block;
      width: 50px;
      height: 26px;
    }
    .switch input { display: none; }
    .slider {
      position: absolute;
      cursor: pointer;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(100,100,120,0.5);
      backdrop-filter: blur(5px);
      border-radius: 26px;
      transition: 0.3s;
      border: 1px solid rgba(255,255,255,0.2);
    }
    .slider::before {
      content: "";
      position: absolute;
      height: 20px; width: 20px;
      left: 3px; bottom: 2px;
      background: white;
      border-radius: 50%;
      transition: 0.3s ease;
      box-shadow: 0 2px 6px rgba(0,0,0,0.3);
    }
    input:checked + .slider {
      background: linear-gradient(135deg, #00ffd5, #00c853);
      box-shadow: 0 0 15px rgba(0,255,213,0.5);
    }
    input:checked + .slider::before {
      transform: translateX(24px);
    }

    .history {
      margin-top: 10px;
      font-size: 13px;
      text-align: center;
      color: #bbb;
      padding: 8px;
      border-radius: 12px;
      background: rgba(0,0,0,0.2);
      backdrop-filter: blur(5px);
      min-height: 24px;
      line-height: 1.5;
      letter-spacing: 0.5px;
    }

    .history span.mark-true { color: #00ff88; font-weight: bold; }
    .history span.mark-false { color: #ff4d6d; font-weight: bold; }

    @media (max-width: 400px) {
      .menu { width: 240px; left: 10px; padding: 14px; }
      .bubble { left: 10px; top: 100px; width: 50px; height: 50px; font-size: 13px; }
    }
  </style>
</head>
<body>

  <div class="bg-glow"></div>
  <div class="particles" id="particles"></div>

  <iframe src="https://play.lc79b.bet" allow="autoplay"></iframe>

  <div class="bubble" id="bubble">AI</div>

  <div class="menu" id="menu">
    <div class="title">🔮 LC79 • MD5 AI</div>
    <input class="input-md5" id="md5" placeholder="Nhập MD5 (32 ký tự hex)" autocomplete="off">
    <button class="btn btn-predict" onclick="analyse()">⚡ DỰ ĐOÁN</button>

    <div class="result-box" id="result">---</div>
    <div class="confidence" id="confidence"></div>

    <div class="toggle-row">
      🔄 Đảo cầu
      <label class="switch">
        <input type="checkbox" id="reverse">
        <span class="slider"></span>
      </label>
    </div>

    <button class="btn btn-correct" onclick="mark(true)">✔ ĐÚNG</button>
    <button class="btn btn-wrong" onclick="mark(false)">✖ SAI</button>

    <div class="history" id="history"></div>
  </div>

  <script>
    (function() {
      // Tạo hạt
      const particlesContainer = document.getElementById('particles');
      for (let i = 0; i < 35; i++) {
        const p = document.createElement('div');
        p.className = 'particle';
        const size = Math.random() * 4 + 2;
        p.style.width = size + 'px';
        p.style.height = size + 'px';
        p.style.left = Math.random() * 100 + '%';
        p.style.animationDuration = Math.random() * 12 + 8 + 's';
        p.style.animationDelay = Math.random() * 10 + 's';
        p.style.background = `rgba(${Math.random() > 0.5 ? '0,255,213' : '180,130,255'}, ${Math.random()*0.5+0.3})`;
        particlesContainer.appendChild(p);
      }

      // Kéo thả
      function enableDrag(el) {
        let pos1 = 0, pos2 = 0, pos3 = 0, pos4 = 0;
        el.addEventListener('mousedown', (e) => {
          e.stopPropagation();
          pos3 = e.clientX;
          pos4 = e.clientY;
          document.addEventListener('mousemove', onMouseMove);
          document.addEventListener('mouseup', onMouseUp);
        });
        el.addEventListener('touchstart', (e) => {
          e.stopPropagation();
          pos3 = e.touches[0].clientX;
          pos4 = e.touches[0].clientY;
          document.addEventListener('touchmove', onTouchMove, { passive: false });
          document.addEventListener('touchend', onTouchEnd);
        });
        function onMouseMove(e) {
          e.preventDefault();
          pos1 = pos3 - e.clientX;
          pos2 = pos4 - e.clientY;
          pos3 = e.clientX;
          pos4 = e.clientY;
          el.style.top = (el.offsetTop - pos2) + 'px';
          el.style.left = (el.offsetLeft - pos1) + 'px';
        }
        function onTouchMove(e) {
          e.preventDefault();
          pos1 = pos3 - e.touches[0].clientX;
          pos2 = pos4 - e.touches[0].clientY;
          pos3 = e.touches[0].clientX;
          pos4 = e.touches[0].clientY;
          el.style.top = (el.offsetTop - pos2) + 'px';
          el.style.left = (el.offsetLeft - pos1) + 'px';
        }
        function onMouseUp() {
          document.removeEventListener('mousemove', onMouseMove);
          document.removeEventListener('mouseup', onMouseUp);
        }
        function onTouchEnd() {
          document.removeEventListener('touchmove', onTouchMove);
          document.removeEventListener('touchend', onTouchEnd);
        }
      }

      const bubble = document.getElementById('bubble');
      const menu = document.getElementById('menu');
      enableDrag(bubble);
      enableDrag(menu);

      bubble.addEventListener('click', (e) => {
        e.stopPropagation();
        if (menu.style.display === 'block') {
          menu.style.display = 'none';
        } else {
          menu.style.display = 'block';
          menu.style.animation = 'none';
          menu.offsetHeight;
          menu.style.animation = 'fadeSlideIn 0.4s cubic-bezier(0.2, 0.9, 0.3, 1)';
        }
      });

      document.addEventListener('click', function(e) {
        if (!menu.contains(e.target) && e.target !== bubble && !bubble.contains(e.target)) {
          menu.style.display = 'none';
        }
      });

      // THUẬT TOÁN SIÊU CHUẨN
      function validMD5(str) { return /^[a-f0-9]{32}$/i.test(str); }

      function parity(hash) {
        let sum = [...hash].reduce((a, b) => a + parseInt(b, 16), 0);
        return sum % 2 === 0 ? 'Tài' : 'Xỉu';
      }
      function highNibble(hash) { return parseInt(hash[0], 16) > 7 ? 'Tài' : 'Xỉu'; }
      function entropyAvg(hash) {
        let nums = [...hash].map(c => parseInt(c, 16));
        return nums.reduce((a, b) => a + b) / nums.length > 7.5 ? 'Tài' : 'Xỉu';
      }
      function edge(hash) { return parseInt(hash.slice(-1), 16) % 2 === 0 ? 'Tài' : 'Xỉu'; }
      function bitDensity(hash) {
        let bits = '';
        for (let c of hash) bits += parseInt(c, 16).toString(2).padStart(4, '0');
        return bits.split('1').length - 1 > 64 ? 'Tài' : 'Xỉu';
      }
      function runsTest(hash) {
        let bits = '';
        for (let c of hash) bits += parseInt(c, 16).toString(2).padStart(4, '0');
        let runs = 1;
        for (let i = 1; i < bits.length; i++) if (bits[i] !== bits[i-1]) runs++;
        return runs > 64 ? 'Tài' : 'Xỉu';
      }
      function checksumInternal(hash) {
        let bytes = [];
        for (let i = 0; i < hash.length; i += 2) bytes.push(parseInt(hash.substr(i, 2), 16));
        return (bytes.reduce((a, b) => a + b, 0) % 256) > 127 ? 'Tài' : 'Xỉu';
      }

      const weights = {
        parity: 1.0, highNibble: 0.9, entropyAvg: 0.85,
        edge: 1.1, bitDensity: 0.8, runsTest: 0.75, checksumInternal: 0.7
      };

      let learnHistory = [];

      function predictAdvanced(hash) {
        const features = {
          parity: parity(hash), highNibble: highNibble(hash), entropyAvg: entropyAvg(hash),
          edge: edge(hash), bitDensity: bitDensity(hash), runsTest: runsTest(hash),
          checksumInternal: checksumInternal(hash)
        };
        let scoreTai = 0, scoreXiu = 0, totalWeight = 0;
        for (let [k, v] of Object.entries(features)) {
          let w = weights[k] || 1.0;
          totalWeight += w;
          v === 'Tài' ? scoreTai += w : scoreXiu += w;
        }
        if (learnHistory.length >= 5) {
          let recent = learnHistory.slice(-10);
          let correct = recent.filter(x => x === true).length;
          let adj = (correct / recent.length - 0.5) * 0.4;
          scoreTai += adj; scoreXiu -= adj;
        }
        let res = scoreTai > scoreXiu ? 'Tài' : 'Xỉu';
        if (document.getElementById('reverse').checked) res = res === 'Tài' ? 'Xỉu' : 'Tài';
        let conf = Math.round((Math.max(scoreTai, scoreXiu) / totalWeight) * 100);
        conf = Math.min(99, Math.max(51, conf));
        return { res, confidence: conf };
      }

      let historyArr = [];
      let lastHash = null;

      function addHistory(isCorrect) {
        historyArr.unshift(isCorrect);
        if (historyArr.length > 12) historyArr.pop();
        learnHistory.push(isCorrect);
        if (learnHistory.length > 30) learnHistory.shift();
        renderHistory();
      }

      function renderHistory() {
        const display = historyArr.map(v => 
          v ? '<span class="mark-true">✓</span>' : '<span class="mark-false">✖</span>'
        ).join(' ');
        document.getElementById('history').innerHTML = '📜 Lịch sử: ' + (display || '---');
      }

      window.analyse = function() {
        const md5 = document.getElementById('md5').value.trim();
        if (!validMD5(md5)) return alert('❌ MD5 không hợp lệ!');
        const p = predictAdvanced(md5);
        lastHash = md5;
        const resDiv = document.getElementById('result');
        resDiv.className = 'result-box ' + (p.res === 'Tài' ? 'tai' : 'xiu');
        resDiv.textContent = p.res;
        document.getElementById('confidence').textContent = `📊 Độ tin cậy: ${p.confidence}% (siêu chuẩn)`;
        resDiv.style.transform = 'scale(1.04)';
        setTimeout(() => resDiv.style.transform = 'scale(1)', 200);
        setTimeout(() => document.getElementById('md5').value = '', 1500);
      };

      window.mark = function(ok) {
        if (!lastHash) return alert('⚠️ Chưa có dự đoán!');
        addHistory(ok);
        lastHash = null;
      };

      document.getElementById('md5').addEventListener('keydown', e => {
        if (e.key === 'Enter') analyse();
      });

      renderHistory();
    })();
  </script>
</body>
</html>
