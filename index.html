<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes, maximum-scale=2.0, viewport-fit=cover">
  <title>💠 Discord Crystal Spammer · Auto Nhận Diện · Menu Đẹp</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap');

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --surface: rgba(16, 20, 35, 0.8);
      --blur: blur(28px);
      --primary: #7c6ff7;
      --primary-glow: #b4a9ff;
      --accent: #00d4c8;
      --danger: #ff6b9d;
      --success: #2ed8a3;
      --text: #f0f3ff;
      --text-dim: #a8aecb;
      --radius-xl: 2.8rem;
      --radius-lg: 2rem;
      --radius-md: 1.5rem;
    }

    body {
      font-family: 'Plus Jakarta Sans', 'Inter', system-ui, sans-serif;
      background: radial-gradient(ellipse at 25% 15%, #1b1e42 0%, #0a0c1f 55%, #020310 100%);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 1.5rem;
      background-attachment: fixed;
      position: relative;
    }

    body::before {
      content: '';
      position: fixed;
      top: -15%;
      left: -8%;
      width: 65%;
      height: 65%;
      background: radial-gradient(circle at 30% 30%, rgba(124,111,247,0.12) 0%, transparent 65%);
      z-index: 0;
      pointer-events: none;
    }

    body::after {
      content: '';
      position: fixed;
      bottom: -18%;
      right: -10%;
      width: 60%;
      height: 60%;
      background: radial-gradient(circle at 70% 70%, rgba(0,212,200,0.1) 0%, transparent 65%);
      z-index: 0;
      pointer-events: none;
    }

    .main-container {
      position: relative;
      z-index: 2;
      max-width: 880px;
      width: 100%;
      background: var(--surface);
      backdrop-filter: var(--blur);
      -webkit-backdrop-filter: var(--blur);
      border-radius: var(--radius-xl);
      padding: 2.3rem 2.3rem 2.6rem;
      box-shadow: 
        0 45px 80px rgba(0,0,0,0.8),
        0 0 0 1px rgba(255,255,255,0.05),
        inset 0 1px 0 rgba(255,255,255,0.04);
      border: 1px solid rgba(255,255,255,0.07);
    }

    /* HEADER + PROFILE */
    .header-section {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 18px;
      margin-bottom: 2.2rem;
    }

    .logo-area {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .logo-emoji {
      font-size: 2.5rem;
      filter: drop-shadow(0 0 14px #7c6ff7);
    }

    h1 {
      font-weight: 700;
      font-size: 1.9rem;
      letter-spacing: -0.4px;
      background: linear-gradient(to right, #eef3ff, #c6cdff);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .profile-card {
      display: flex;
      align-items: center;
      gap: 14px;
      background: rgba(12, 15, 28, 0.7);
      backdrop-filter: blur(14px);
      padding: 0.6rem 1.2rem 0.6rem 0.8rem;
      border-radius: 4rem;
      border: 1px solid rgba(255,255,255,0.1);
      box-shadow: 0 10px 20px rgba(0,0,0,0.4);
    }

    .avatar-wrapper {
      position: relative;
    }

    .avatar {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      background: #2b2f4a;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.5rem;
      background-size: cover;
      background-position: center;
      box-shadow: 0 0 12px rgba(124,111,247,0.6);
      border: 2px solid #7c6ff7;
      overflow: hidden;
    }

    .online-dot {
      position: absolute;
      bottom: 2px;
      right: 2px;
      width: 13px;
      height: 13px;
      background: #666;
      border-radius: 50%;
      border: 2px solid #0f1225;
    }

    .user-info {
      display: flex;
      flex-direction: column;
    }

    .username-display {
      font-weight: 700;
      font-size: 1rem;
      color: white;
      letter-spacing: 0.2px;
    }

    .tag-display {
      font-size: 0.75rem;
      color: #a0a7d0;
    }

    /* TOKEN ROW */
    .token-row {
      background: rgba(8, 11, 20, 0.7);
      border-radius: 3rem;
      padding: 0.9rem 1.3rem;
      margin-bottom: 2rem;
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 12px;
      border: 1px solid rgba(255,255,255,0.07);
    }

    .token-row label {
      font-weight: 600;
      color: #c0c8f0;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .token-input {
      flex: 2;
      min-width: 210px;
      background: #050816;
      border: 1px solid #353d60;
      border-radius: 2.5rem;
      padding: 0.7rem 1.3rem;
      color: #f0f4ff;
      outline: none;
      font-size: 0.9rem;
      transition: 0.25s;
    }

    .token-input:focus {
      border-color: #7c6ff7;
      box-shadow: 0 0 16px #7c6ff750;
    }

    .btn-save {
      background: #7c6ff7;
      border: none;
      color: white;
      font-weight: 650;
      padding: 0.7rem 1.8rem;
      border-radius: 2.5rem;
      cursor: pointer;
      transition: 0.25s;
      display: flex;
      align-items: center;
      gap: 6px;
      box-shadow: 0 8px 18px #7c6ff750;
      letter-spacing: 0.3px;
    }

    .btn-save:hover {
      background: #6658e0;
      box-shadow: 0 10px 22px #7c6ff780;
    }

    /* TABS MENU */
    .tabs-nav {
      display: flex;
      gap: 6px;
      background: #0b0f1e;
      padding: 6px;
      border-radius: 3.5rem;
      width: fit-content;
      margin-bottom: 2rem;
      border: 1px solid rgba(255,255,255,0.05);
    }

    .tab-btn {
      background: transparent;
      border: none;
      color: #878ec9;
      font-weight: 600;
      padding: 0.6rem 2rem;
      border-radius: 3rem;
      cursor: pointer;
      transition: all 0.2s ease;
      font-size: 0.9rem;
      letter-spacing: 0.2px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .tab-btn.active {
      background: #7c6ff7;
      color: white;
      box-shadow: 0 12px 22px #7c6ff760;
    }

    .tab-content {
      display: none;
      animation: fadeSlide 0.28s cubic-bezier(0.2,0.9,0.4,1);
    }

    .tab-content.active {
      display: block;
    }

    @keyframes fadeSlide {
      from { opacity: 0.4; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* SPAM CARD */
    .spam-card {
      background: rgba(20, 25, 44, 0.65);
      backdrop-filter: blur(14px);
      border-radius: var(--radius-lg);
      padding: 1.5rem;
      border: 1px solid rgba(255,255,255,0.05);
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    textarea {
      width: 100%;
      background: #0a0e1d;
      border: 1px solid #323a59;
      border-radius: var(--radius-md);
      padding: 0.9rem 1.1rem;
      color: #f2f6ff;
      font-size: 0.95rem;
      resize: vertical;
      outline: none;
      font-family: inherit;
    }

    textarea:focus {
      border-color: #7c6ff7;
      box-shadow: 0 0 12px #7c6ff740;
    }

    .control-row {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 10px;
    }

    .input-pill {
      background: #0b0f1f;
      border: 1px solid #394066;
      border-radius: 2.8rem;
      padding: 0.6rem 1.2rem;
      color: white;
      outline: none;
      width: 140px;
    }

    .input-pill:focus {
      border-color: #7c6ff7;
    }

    .btn {
      border: none;
      color: white;
      padding: 0.65rem 1.5rem;
      border-radius: 2.8rem;
      font-weight: 600;
      cursor: pointer;
      transition: 0.2s;
      display: inline-flex;
      align-items: center;
      gap: 5px;
    }

    .btn-primary {
      background: #7c6ff7;
      box-shadow: 0 6px 16px #7c6ff750;
    }

    .btn-primary:hover { background: #6858e6; }

    .btn-stop {
      background: #ff6b9d;
      box-shadow: 0 4px 14px #ff6b9d60;
    }

    .stats-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #0d1126;
      padding: 0.5rem 1.1rem;
      border-radius: 2rem;
      font-size: 0.85rem;
      color: #cdd2f0;
    }

    .badge-counter {
      background: #2b2f50;
      padding: 3px 14px;
      border-radius: 20px;
      font-weight: 700;
      color: #ffd78b;
    }

    hr {
      border-color: #272d46;
      margin: 20px 0 12px;
    }

    .tip-text {
      font-size: 0.8rem;
      color: #8b91b8;
    }
  </style>
</head>
<body>
<div class="main-container">
  <!-- HEADER + PROFILE -->
  <div class="header-section">
    <div class="logo-area">
      <span class="logo-emoji">💠</span>
      <h1>Crystal Spammer</h1>
    </div>
    <div class="profile-card" id="profileCard">
      <div class="avatar-wrapper">
        <div class="avatar" id="avatarDisplay">🔮</div>
        <div class="online-dot" id="onlineDot"></div>
      </div>
      <div class="user-info">
        <span class="username-display" id="displayName">Chưa đăng nhập</span>
        <span class="tag-display" id="displayTag"></span>
      </div>
    </div>
  </div>

  <!-- TOKEN ROW -->
  <div class="token-row">
    <label>🔐 Token</label>
    <input type="password" id="discordToken" class="token-input" placeholder="Dán token Discord..." autocomplete="off">
    <button id="saveTokenBtn" class="btn-save">💾 Lưu & Nhận diện</button>
  </div>

  <!-- TABS MENU -->
  <div class="tabs-nav">
    <button class="tab-btn active" data-tab="tab1"><span>📌</span> Tab 1</button>
    <button class="tab-btn" data-tab="tab2"><span>💬</span> Tab 2</button>
    <button class="tab-btn" data-tab="tab3"><span>⚡</span> Tab 3</button>
  </div>

  <!-- TAB 1 -->
  <div id="tab1" class="tab-content active">
    <div class="spam-card">
      <label style="font-weight:600;">📝 Nội dung spam</label>
      <textarea id="msg1" rows="3" placeholder="Nhập tin nhắn...">✨ Hello từ tab 1</textarea>
      <div class="control-row">
        <input type="text" id="targetId1" class="input-pill" placeholder="Channel ID" value="">
        <input type="number" id="delay1" class="input-pill" placeholder="Delay ms" value="700" min="400" step="50">
        <button class="btn btn-primary" id="startSpam1">▶ Chạy</button>
        <button class="btn btn-stop" id="stopSpam1">⏹️ Dừng</button>
      </div>
      <div class="stats-bar">
        <span id="status1">⏸️ Chưa bắt đầu</span>
        <span>📨 <span class="badge-counter" id="counter1">0</span></span>
      </div>
    </div>
  </div>

  <!-- TAB 2 -->
  <div id="tab2" class="tab-content">
    <div class="spam-card">
      <label style="font-weight:600;">💬 Nội dung tab 2</label>
      <textarea id="msg2" rows="3" placeholder="Spam nội dung khác...">🚀 Tab 2 speed</textarea>
      <div class="control-row">
        <input type="text" id="targetId2" class="input-pill" placeholder="Channel ID" value="">
        <input type="number" id="delay2" class="input-pill" placeholder="Delay ms" value="800" min="400">
        <button class="btn btn-primary" id="startSpam2">▶ Chạy</button>
        <button class="btn btn-stop" id="stopSpam2">⏹️ Dừng</button>
      </div>
      <div class="stats-bar">
        <span id="status2">⏸️ Sẵn sàng</span>
        <span>📨 <span class="badge-counter" id="counter2">0</span></span>
      </div>
    </div>
  </div>

  <!-- TAB 3 -->
  <div id="tab3" class="tab-content">
    <div class="spam-card">
      <label style="font-weight:600;">⚡ Tab 3 siêu tốc</label>
      <textarea id="msg3" rows="3" placeholder="Nội dung...">🔥 Spam cực nhanh</textarea>
      <div class="control-row">
        <input type="text" id="targetId3" class="input-pill" placeholder="Channel ID" value="">
        <input type="number" id="delay3" class="input-pill" placeholder="Delay ms" value="600" min="400">
        <button class="btn btn-primary" id="startSpam3">▶ Chạy</button>
        <button class="btn btn-stop" id="stopSpam3">⏹️ Dừng</button>
      </div>
      <div class="stats-bar">
        <span id="status3">⏸️ Chưa kích hoạt</span>
        <span>📨 <span class="badge-counter" id="counter3">0</span></span>
      </div>
    </div>
  </div>

  <hr>
  <div class="tip-text">
    💡 <strong>Tự động nhận diện:</strong> Dán token → Lưu, tool sẽ lấy avatar + tên ngay. Token không cần dấu ngoặc kép.
  </div>
</div>

<script>
  (function() {
    // ---------- STORAGE ----------
    const TOKEN_KEY = 'crystal_spammer_token';
    const tokenInput = document.getElementById('discordToken');
    const saveBtn = document.getElementById('saveTokenBtn');
    const avatarEl = document.getElementById('avatarDisplay');
    const displayNameEl = document.getElementById('displayName');
    const displayTagEl = document.getElementById('displayTag');
    const onlineDot = document.getElementById('onlineDot');

    // Xử lý token: tự động loại bỏ dấu ngoặc kép nếu có
    function cleanToken(rawToken) {
      let cleaned = rawToken.trim();
      // Loại bỏ dấu " ở đầu và cuối
      if (cleaned.startsWith('"') && cleaned.endsWith('"')) {
        cleaned = cleaned.slice(1, -1).trim();
      }
      return cleaned;
    }

    function loadToken() {
      const saved = localStorage.getItem(TOKEN_KEY);
      if (saved) {
        const clean = cleanToken(saved);
        tokenInput.value = clean;
        fetchUserProfile(clean);
      }
    }
    loadToken();

    // Auto nhận diện tài khoản từ token
    async function fetchUserProfile(token) {
      if (!token) {
        setDefaultAvatar();
        return;
      }
      try {
        const res = await fetch('https://discord.com/api/v10/users/@me', {
          headers: { 'Authorization': token }
        });
        if (!res.ok) throw new Error('Token không hợp lệ');
        const user = await res.json();
        updateProfileUI(user);
        // Lưu token sạch nếu chưa lưu
        if (!localStorage.getItem(TOKEN_KEY)) {
          localStorage.setItem(TOKEN_KEY, token);
        }
      } catch (e) {
        console.warn('Không lấy được profile:', e);
        setDefaultAvatar();
      }
    }

    function updateProfileUI(user) {
      const avatarHash = user.avatar;
      const userId = user.id;
      const username = user.global_name || user.username || 'Người dùng';
      const discriminator = user.discriminator === '0' ? '' : `#${user.discriminator}`;

      displayNameEl.textContent = username;
      displayTagEl.textContent = discriminator || `@${user.username}`;

      if (avatarHash) {
        const avatarUrl = `https://cdn.discordapp.com/avatars/${userId}/${avatarHash}.png?size=64`;
        avatarEl.style.backgroundImage = `url(${avatarUrl})`;
        avatarEl.style.backgroundSize = 'cover';
        avatarEl.textContent = '';
      } else {
        avatarEl.style.backgroundImage = '';
        avatarEl.textContent = '🔮';
      }
      onlineDot.style.background = '#2ed8a3';
    }

    function setDefaultAvatar() {
      avatarEl.style.backgroundImage = '';
      avatarEl.textContent = '🔮';
      displayNameEl.textContent = 'Chưa đăng nhập';
      displayTagEl.textContent = '';
      onlineDot.style.background = '#666';
    }

    saveBtn.addEventListener('click', async () => {
      const rawToken = tokenInput.value;
      const token = cleanToken(rawToken);
      if (!token) { alert('Nhập token!'); return; }
      tokenInput.value = token;
      localStorage.setItem(TOKEN_KEY, token);
      await fetchUserProfile(token);
    });

    // Tự động nhận diện khi blur
    tokenInput.addEventListener('blur', () => {
      const token = cleanToken(tokenInput.value);
      if (token) {
        tokenInput.value = token;
        fetchUserProfile(token);
      }
    });

    // ---------- TABS ----------
    document.querySelectorAll('.tab-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
        btn.classList.add('active');
        document.getElementById(btn.dataset.tab).classList.add('active');
      });
    });

    // ---------- SPAM ENGINE ----------
    const state = {
      tab1: { interval: null, count: 0, retry: 0 },
      tab2: { interval: null, count: 0, retry: 0 },
      tab3: { interval: null, count: 0, retry: 0 }
    };

    function getToken() {
      return cleanToken(tokenInput.value);
    }

    async function sendMsg(channelId, content, token) {
      const res = await fetch(`https://discord.com/api/v10/channels/${channelId}/messages`, {
        method: 'POST',
        headers: { 'Authorization': token, 'Content-Type': 'application/json' },
        body: JSON.stringify({ content })
      });
      if (res.status === 429) {
        const d = await res.json();
        throw { rateLimit: true, retryAfter: (d.retry_after || 1.5) * 1000 };
      }
      if (!res.ok) throw new Error((await res.json().catch(()=>({})).message) || `Lỗi ${res.status}`);
    }

    function updateTabUI(tab, status, count) {
      document.getElementById(`status${tab}`).textContent = status;
      document.getElementById(`counter${tab}`).textContent = count;
    }

    function stop(tab) {
      if (state[tab].interval) clearInterval(state[tab].interval);
      state[tab].interval = null;
    }

    async function cycle(tab) {
      const s = state[tab];
      const num = tab.replace('tab','');
      const msg = document.getElementById(`msg${num}`).value.trim();
      const ch = document.getElementById(`targetId${num}`).value.trim();
      const token = getToken();
      if (!token || !ch || !msg) { stop(tab); updateTabUI(num, '❌ Thiếu token/channel/nội dung', s.count); return; }
      if (s.retry > Date.now()) {
        updateTabUI(num, `⏳ Chờ rate limit...`, s.count);
        return;
      }
      try {
        await sendMsg(ch, msg, token);
        s.count++;
        updateTabUI(num, `✅ Đã gửi (${new Date().toLocaleTimeString()})`, s.count);
      } catch(e) {
        if (e.rateLimit) {
          s.retry = Date.now() + e.retryAfter + 200;
          updateTabUI(num, `⛔ Rate limit ${Math.round(e.retryAfter/1000)}s`, s.count);
        } else {
          updateTabUI(num, `❌ ${e.message}`, s.count);
          if (e.message.includes('401')) stop(tab);
        }
      }
    }

    function start(tab) {
      const num = tab.replace('tab','');
      if (!getToken()) { alert('Cần token!'); return; }
      stop(tab);
      const delay = Math.max(400, parseInt(document.getElementById(`delay${num}`).value)||700);
      state[tab].retry = 0;
      cycle(tab);
      state[tab].interval = setInterval(() => cycle(tab), delay);
    }

    document.getElementById('startSpam1').onclick = ()=> start('tab1');
    document.getElementById('stopSpam1').onclick = ()=> stop('tab1');
    document.getElementById('startSpam2').onclick = ()=> start('tab2');
    document.getElementById('stopSpam2').onclick = ()=> stop('tab2');
    document.getElementById('startSpam3').onclick = ()=> start('tab3');
    document.getElementById('stopSpam3').onclick = ()=> stop('tab3');

    window.addEventListener('beforeunload', () => {
      Object.keys(state).forEach(t => stop(t));
    });
  })();
</script>
</body>
</html>
