<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Tool By Minh hỉu</title>
<style>
  :root {
    --bg: #0a0a0f;
    --card: rgba(20, 20, 30, 0.85);
    --gold: #ffd700;
    --orange: #ff8c00;
    --red: #ff2d55;
    --purple: #af52de;
    --blue: #0a84ff;
    --green: #30d158;
    --text: #f5f5f7;
    --muted: #8e8e93;
    --border: rgba(255,255,255,0.08);
  }
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    overflow-x: hidden;
    background-image:
      radial-gradient(ellipse at 20% 0%, rgba(255,140,0,0.12) 0%, transparent 50%),
      radial-gradient(ellipse at 80% 100%, rgba(175,82,222,0.1) 0%, transparent 50%);
  }
  .container {
    max-width: 480px;
    margin: 0 auto;
    padding: 12px 14px 40px;
  }
  /* HEADER */
  .header {
    text-align: center;
    padding: 16px 0 8px;
  }
  .header h1 {
    font-size: 1.15rem;
    font-weight: 700;
    letter-spacing: 1px;
    background: linear-gradient(90deg, #ffd700, #ff8c00, #af52de);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
  }
  .header p { font-size: 0.75rem; color: var(--muted); margin-top: 4px; }

  /* PLATFORM SELECT */
  .platform-row {
    display: flex;
    gap: 10px;
    margin: 14px 0;
  }
  .plat-btn {
    flex: 1;
    background: var(--card);
    border: 1.5px solid var(--border);
    border-radius: 16px;
    padding: 12px 8px;
    cursor: pointer;
    transition: all 0.25s ease;
    backdrop-filter: blur(12px);
    text-align: center;
  }
  .plat-btn img {
    height: 52px;
    width: auto;
    object-fit: contain;
    display: block;
    margin: 0 auto 6px;
    filter: drop-shadow(0 2px 6px rgba(0,0,0,0.4));
  }
  .plat-btn span {
    font-size: 0.8rem;
    font-weight: 600;
    color: var(--muted);
  }
  .plat-btn.active {
    border-color: var(--gold);
    box-shadow: 0 0 20px rgba(255,215,0,0.25), inset 0 0 20px rgba(255,215,0,0.05);
    transform: translateY(-2px);
  }
  .plat-btn.active span { color: var(--gold); }
  .plat-btn[data-plat="lc79"].active {
    border-color: var(--purple);
    box-shadow: 0 0 20px rgba(175,82,222,0.3), inset 0 0 20px rgba(175,82,222,0.06);
  }
  .plat-btn[data-plat="lc79"].active span { color: #d4a5ff; }

  /* MODE TABS */
  .mode-tabs {
    display: flex;
    gap: 8px;
    margin-bottom: 14px;
  }
  .mode-btn {
    flex: 1;
    padding: 10px 0;
    border-radius: 12px;
    border: 1px solid var(--border);
    background: rgba(255,255,255,0.03);
    color: var(--muted);
    font-size: 0.85rem;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.2s;
  }
  .mode-btn.active {
    background: linear-gradient(135deg, rgba(255,140,0,0.25), rgba(255,215,0,0.15));
    border-color: var(--orange);
    color: var(--gold);
    box-shadow: 0 0 12px rgba(255,140,0,0.2);
  }
  .mode-btn.lc.active {
    background: linear-gradient(135deg, rgba(175,82,222,0.3), rgba(255,45,85,0.15));
    border-color: var(--purple);
    color: #e0b0ff;
    box-shadow: 0 0 12px rgba(175,82,222,0.25);
  }

  /* MAIN CARD */
  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 18px 16px;
    backdrop-filter: blur(16px);
    box-shadow: 0 8px 32px rgba(0,0,0,0.4);
    margin-bottom: 14px;
  }
  .phien-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 16px;
  }
  .phien-label { font-size: 0.75rem; color: var(--muted); }
  .phien-num {
    font-size: 1.35rem;
    font-weight: 800;
    letter-spacing: 0.5px;
    font-variant-numeric: tabular-nums;
  }
  .status-dot {
    width: 8px; height: 8px;
    border-radius: 50%;
    background: var(--green);
    display: inline-block;
    margin-right: 6px;
    box-shadow: 0 0 8px var(--green);
    animation: pulse 1.5s infinite;
  }
  @keyframes pulse {
    0%,100% { opacity:1; }
    50% { opacity:0.4; }
  }

  /* RESULT + PREDICT */
  .result-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
    margin-bottom: 14px;
  }
  .box {
    background: rgba(255,255,255,0.03);
    border-radius: 14px;
    padding: 14px 10px;
    text-align: center;
    border: 1px solid var(--border);
  }
  .box .label { font-size: 0.7rem; color: var(--muted); margin-bottom: 6px; text-transform: uppercase; letter-spacing: 0.5px; }
  .box .value {
    font-size: 1.4rem;
    font-weight: 800;
    letter-spacing: 1px;
  }
  .box.tai .value { color: #ff453a; text-shadow: 0 0 12px rgba(255,69,58,0.5); }
  .box.xiu .value { color: #64d2ff; text-shadow: 0 0 12px rgba(100,210,255,0.5); }
  .box.predict {
    grid-column: 1 / -1;
    background: linear-gradient(135deg, rgba(255,215,0,0.08), rgba(255,140,0,0.05));
    border-color: rgba(255,215,0,0.25);
  }
  .box.predict .value {
    font-size: 1.8rem;
    background: linear-gradient(90deg, #ffd700, #ff9500);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    text-shadow: none;
  }
  .box.predict.xiu-p .value {
    background: linear-gradient(90deg, #64d2ff, #0a84ff);
    -webkit-background-clip: text;
  }

  /* CONF + INFO */
  .info-row {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    margin-top: 4px;
  }
  .chip {
    font-size: 0.72rem;
    padding: 5px 10px;
    border-radius: 20px;
    background: rgba(255,255,255,0.05);
    border: 1px solid var(--border);
    color: var(--muted);
  }
  .chip.high { color: var(--green); border-color: rgba(48,209,88,0.3); background: rgba(48,209,88,0.1); }
  .chip.med { color: var(--gold); border-color: rgba(255,215,0,0.3); background: rgba(255,215,0,0.08); }
  .chip.low { color: var(--muted); }

  .explain {
    margin-top: 12px;
    font-size: 0.8rem;
    color: #c7c7cc;
    line-height: 1.45;
    padding: 10px 12px;
    background: rgba(0,0,0,0.25);
    border-radius: 12px;
    border-left: 3px solid var(--orange);
  }

  /* DICES */
  .dices {
    display: flex;
    justify-content: center;
    gap: 8px;
    margin: 10px 0 4px;
  }
  .dice {
    width: 36px; height: 36px;
    background: linear-gradient(145deg, #fff, #e0e0e0);
    border-radius: 8px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: 800;
    font-size: 1.1rem;
    color: #222;
    box-shadow: 0 3px 8px rgba(0,0,0,0.3);
  }

  /* CONTROLS */
  .controls {
    display: flex;
    gap: 10px;
    margin-top: 16px;
  }
  .btn {
    flex: 1;
    padding: 13px 0;
    border: none;
    border-radius: 14px;
    font-size: 0.9rem;
    font-weight: 700;
    cursor: pointer;
    transition: all 0.2s;
    letter-spacing: 0.3px;
  }
  .btn-refresh {
    background: linear-gradient(135deg, #ff9500, #ff6b00);
    color: #fff;
    box-shadow: 0 4px 16px rgba(255,149,0,0.35);
  }
  .btn-refresh:active { transform: scale(0.97); }
  .btn-auto {
    background: rgba(255,255,255,0.06);
    color: var(--text);
    border: 1px solid var(--border);
  }
  .btn-auto.on {
    background: linear-gradient(135deg, rgba(48,209,88,0.25), rgba(48,209,88,0.1));
    border-color: var(--green);
    color: var(--green);
    box-shadow: 0 0 14px rgba(48,209,88,0.25);
  }

  /* HISTORY STRIP (simple pattern only) */
  .pattern-strip {
    margin-top: 12px;
    overflow-x: auto;
    white-space: nowrap;
    padding: 8px 0;
    -webkit-overflow-scrolling: touch;
  }
  .pattern-strip::-webkit-scrollbar { height: 3px; }
  .pattern-strip::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.15); border-radius: 3px; }
  .p-item {
    display: inline-flex;
    width: 22px; height: 22px;
    border-radius: 5px;
    align-items: center;
    justify-content: center;
    font-size: 0.65rem;
    font-weight: 700;
    margin-right: 3px;
  }
  .p-item.T { background: rgba(255,69,58,0.25); color: #ff6961; }
  .p-item.X { background: rgba(100,210,255,0.2); color: #64d2ff; }

  .footer {
    text-align: center;
    font-size: 0.65rem;
    color: var(--muted);
    margin-top: 18px;
    opacity: 0.7;
  }
  .loading {
    text-align: center;
    padding: 30px;
    color: var(--muted);
    font-size: 0.9rem;
  }
  .spinner {
    width: 28px; height: 28px;
    border: 3px solid rgba(255,255,255,0.1);
    border-top-color: var(--gold);
    border-radius: 50%;
    animation: spin 0.7s linear infinite;
    margin: 0 auto 10px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .error-box {
    background: rgba(255,45,85,0.12);
    border: 1px solid rgba(255,45,85,0.3);
    color: #ff6b81;
    padding: 12px;
    border-radius: 12px;
    font-size: 0.8rem;
    text-align: center;
  }
</style>
</head>
<body>
<div class="container">
  <div class="header">
    <h1>SUN.WIN × LC79 TOOL</h1>
    <p>Tài Xỉu · Sicbo · MD5 · Hũ</p>
  </div>

  <!-- Platform -->
  <div class="platform-row">
    <div class="plat-btn active" data-plat="sunwin" onclick="selectPlat('sunwin')">
      <img id="logo-sun" alt="SunWin">
      <span>SUN.WIN</span>
    </div>
    <div class="plat-btn" data-plat="lc79" onclick="selectPlat('lc79')">
      <img id="logo-lc" alt="LC79">
      <span>LC79</span>
    </div>
  </div>

  <!-- Modes -->
  <div class="mode-tabs" id="modeTabs">
    <button class="mode-btn active" data-mode="tx" onclick="selectMode('tx')">Tài Xỉu</button>
    <button class="mode-btn" data-mode="sicbo" onclick="selectMode('sicbo')">Sicbo</button>
  </div>

  <!-- Main Card -->
  <div class="card" id="mainCard">
    <div class="loading" id="loading">
      <div class="spinner"></div>
      Đang tải dữ liệu...
    </div>
    <div id="content" style="display:none"></div>
  </div>

  <!-- Controls -->
  <div class="controls">
    <button class="btn btn-refresh" onclick="fetchData(true)">↻ Làm mới</button>
    <button class="btn btn-auto" id="btnAuto" onclick="toggleAuto()">▶ Tự động</button>
  </div>

  <div class="footer">Tool dự đoán · Chỉ mang tính tham khảo</div>
</div>

  if (p === 'sunwin') {
    tabs.innerHTML = `
      <button class="mode-btn active" data-mode="tx" onclick="selectMode('tx')">Tài Xỉu</button>
      <button class="mode-btn" data-mode="sicbo" onclick="selectMode('sicbo')">Sicbo</button>`;
    mode = 'tx';
  } else {
    tabs.innerHTML = `
      <button class="mode-btn lc active" data-mode="md5" onclick="selectMode('md5')">MD5</button>
      <button class="mode-btn lc" data-mode="hu" onclick="selectMode('hu')">Hũ</button>`;
    mode = 'md5';
  }
  fetchData(true);
}

function selectMode(m) {
  mode = m;
  document.querySelectorAll('.mode-btn').forEach(b => {
    b.classList.toggle('active', b.dataset.mode === m);
    if (platform === 'lc79') b.classList.add('lc');
  });
  fetchData(true);
}

// ========== FETCH ==========
async function fetchData(manual = false) {
  const loading = document.getElementById('loading');
  const content = document.getElementById('content');
  if (manual) {
    loading.style.display = 'block';
    content.style.display = 'none';
  }

  try {
    let url;
    if (platform === 'sunwin') {
      url = mode === 'tx' ? APIS.sunwin_tx() : APIS.sunwin_sicbo;
    } else {
      url = mode === 'md5' ? APIS.lc79_md5 : APIS.lc79_hu;
    }

    const res = await fetch(url, { cache: 'no-store' });
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const data = await res.json();

    if (platform === 'sunwin') {
      renderSunWin(data);
    } else {
      renderLC79(data);
    }
    loading.style.display = 'none';
    content.style.display = 'block';
  } catch (err) {
    loading.style.display = 'none';
    content.style.display = 'block';
    content.innerHTML = `<div class="error-box">Lỗi kết nối API<br><small>${err.message}</small><br>Thử lại sau vài giây</div>`;
  }
}

// ========== RENDER SUNWIN ==========
function renderSunWin(data) {
  let phien, pred, ketQua, conf, explain, pattern = '';

  if (mode === 'tx') {
    phien = data.phien || data.phien_dudoan || '—';
    pred = (data.du_doan_van_sau || data.du_doan || '—').toUpperCase();
    ketQua = (data.ket_qua_hien_tai || '—').toUpperCase();
    conf = data.do_tin_cay || (data.ty_le_thanh_cong ? data.ty_le_thanh_cong : '—');
    explain = data.giai_thich_chi_tiet || data.giai_thich || data.he_thong || '';
    if (data.pattern_recent_20) pattern = data.pattern_recent_20;
    else if (data.pattern_recent_50) pattern = data.pattern_recent_50.slice(-20);
  } else {
    // sicbo
    phien = data.phien || '—';
    pred = (data.du_doan || '—').toUpperCase();
    ketQua = (data.ket_qua || '—').toUpperCase();
    conf = data.confidence != null ? data.confidence + '%' : '—';
    explain = data.mode || '';
    if (data.past_vi) pattern = data.past_vi;
  }

  const isXiu = pred.includes('XỈU') || pred.includes('XIU') || pred === 'X';
  const isTai = pred.includes('TÀI') || pred.includes('TAI') || pred === 'T';
  const predClass = isXiu ? 'xiu-p' : '';

  const kqClass = (ketQua.includes('XỈU') || ketQua.includes('XIU')) ? 'xiu' : 'tai';

  let confChip = 'med';
  if (typeof conf === 'string' && (conf.includes('cao') || conf.includes('Rất'))) confChip = 'high';
  if (typeof conf === 'number' && conf >= 60) confChip = 'high';
  if (typeof conf === 'number' && conf < 40) confChip = 'low';

  let html = `
    <div class="phien-row">
      <div>
        <div class="phien-label"><span class="status-dot"></span>Phiên hiện tại</div>
        <div class="phien-num">#${phien}</div>
      </div>
      <div style="text-align:right">
        <div class="phien-label">Phiên dự đoán</div>
        <div class="phien-num" style="font-size:1.1rem;color:var(--gold)">#${Number(phien) + 1 || '—'}</div>
      </div>
    </div>

    <div class="result-grid">
      <div class="box ${kqClass}">
        <div class="label">Kết quả gần nhất</div>
        <div class="value">${ketQua}</div>
      </div>
      <div class="box">
        <div class="label">Độ tin cậy</div>
        <div class="value" style="font-size:1.15rem;color:var(--gold)">${conf}</div>
      </div>
      <div class="box predict ${predClass}">
        <div class="label">Dự đoán phiên sau</div>
        <div class="value">${pred}</div>
      </div>
    </div>
  `;

  if (explain) {
    html += `<div class="explain">${explain}</div>`;
  }

  if (pattern) {
    html += `<div class="pattern-strip">`;
    // if string of T/X
    if (typeof pattern === 'string' && /^[TX]+$/i.test(pattern.replace(/,/g,''))) {
      const arr = pattern.replace(/,/g,'').split('');
      arr.forEach(c => {
        html += `<span class="p-item ${c.toUpperCase()}">${c.toUpperCase()}</span>`;
      });
    } else if (typeof pattern === 'string') {
      // numbers like past_vi
      pattern.split(',').forEach(n => {
        const num = parseInt(n);
        const cls = (num >= 11) ? 'T' : 'X';
        html += `<span class="p-item ${cls}">${n.trim()}</span>`;
      });
    }
    html += `</div>`;
  }

  document.getElementById('content').innerHTML = html;
  lastPhien = phien;
}

// ========== RENDER LC79 ==========
function renderLC79(data) {
  const list = data.list || [];
  if (!list.length) {
    document.getElementById('content').innerHTML = `<div class="error-box">Không có dữ liệu phiên</div>`;
    return;
  }

  // list newest first
  const latest = list[0];
  const phien = latest.id;
  const ketQua = latest.resultTruyenThong === 'TAI' ? 'TÀI' : 'XỈU';
  const dices = latest.dices || [];
  const point = latest.point;

  // Build pattern string (newest first → reverse for display left=old)
  const results = list.slice(0, 40).map(x => x.resultTruyenThong === 'TAI' ? 'T' : 'X');
  const predObj = predictFromHistory(results);

  const pred = predObj.pred;
  const isXiu = pred === 'XỈU';
  const conf = predObj.conf;
  const confChip = conf >= 70 ? 'high' : conf >= 50 ? 'med' : 'low';

  let html = `
    <div class="phien-row">
      <div>
        <div class="phien-label"><span class="status-dot"></span>Phiên hiện tại</div>
        <div class="phien-num">#${phien}</div>
      </div>
      <div style="text-align:right">
        <div class="phien-label">Phiên dự đoán</div>
        <div class="phien-num" style="font-size:1.1rem;color:#d4a5ff">#${phien + 1}</div>
      </div>
    </div>

    <div class="dices">
      ${dices.map(d => `<div class="dice">${d}</div>`).join('')}
      <div style="align-self:center;margin-left:6px;font-size:0.85rem;color:var(--muted)">= ${point}</div>
    </div>

    <div class="result-grid">
      <div class="box ${ketQua === 'TÀI' ? 'tai' : 'xiu'}">
        <div class="label">Kết quả gần nhất</div>
        <div class="value">${ketQua}</div>
      </div>
      <div class="box">
        <div class="label">Độ tin cậy</div>
        <div class="value" style="font-size:1.15rem;color:#d4a5ff">${conf}%</div>
      </div>
      <div class="box predict ${isXiu ? 'xiu-p' : ''}">
        <div class="label">Dự đoán phiên sau</div>
        <div class="value">${pred}</div>
      </div>
    </div>

    <div class="info-row">
      <span class="chip ${confChip}">Streak: ${predObj.streak} ${predObj.last}</span>
      <span class="chip">${mode === 'md5' ? 'MD5' : 'Hũ'} · ${list.length} phiên</span>
    </div>
  `;

  // pattern strip (oldest left → newest right)
  const show = results.slice(0, 30).reverse();
  html += `<div class="pattern-strip">`;
  show.forEach(c => {
    html += `<span class="p-item ${c}">${c}</span>`;
  });
  html += `</div>`;

  document.getElementById('content').innerHTML = html;
  lastPhien = phien;
}

// ========== SIMPLE PREDICTOR FOR LC79 ==========
function predictFromHistory(results) {
  // results: newest first, 'T' or 'X'
  if (results.length < 3) return { pred: 'TÀI', conf: 50, streak: 0, last: '?' };

  let streak = 1;
  for (let i = 1; i < results.length; i++) {
    if (results[i] === results[0]) streak++;
    else break;
  }
  const last = results[0];

  // count last 12
  const last12 = results.slice(0, 12);
  const tCount = last12.filter(r => r === 'T').length;
  const xCount = last12.length - tCount;

  let pred, conf;

  if (streak >= 5) {
    // break long streak
    pred = last === 'T' ? 'XỈU' : 'TÀI';
    conf = Math.min(82, 55 + streak * 5);
  } else if (streak >= 3) {
    // follow medium streak
    pred = last === 'T' ? 'TÀI' : 'XỈU';
    conf = 55 + streak * 6;
  } else if (streak === 2) {
    // slight follow
    pred = last === 'T' ? 'TÀI' : 'XỈU';
    conf = 58;
  } else {
    // mean reversion on imbalance
    if (tCount >= 8) {
      pred = 'XỈU';
      conf = 62;
    } else if (xCount >= 8) {
      pred = 'TÀI';
      conf = 62;
    } else {
      // slight opposite of last
      pred = last === 'T' ? 'XỈU' : 'TÀI';
      conf = 52;
    }
  }

  return { pred, conf: Math.round(conf), streak, last };
}

// ========== AUTO ==========
function toggleAuto() {
  isAuto = !isAuto;
  const btn = document.getElementById('btnAuto');
  if (isAuto) {
    btn.classList.add('on');
    btn.textContent = '⏸ Đang tự động';
    fetchData();
    autoTimer = setInterval(() => fetchData(false), 6000);
  } else {
    btn.classList.remove('on');
    btn.textContent = '▶ Tự động';
    if (autoTimer) clearInterval(autoTimer);
    autoTimer = null;
  }
}

// Init
fetchData(true);
</script>
