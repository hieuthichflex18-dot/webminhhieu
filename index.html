        #welcome-screen .welcome-box h1 {

        .marquee-text {
            display: inline-block;

        }
        @keyframes marquee {
            0% { transform: translateX(100%); opacity: 0; }
            10% { opacity: 1; }
            90% { opacity: 1; }
            100% { transform: translateX(-100%); opacity: 0; }

        #welcome-screen .welcome-box .sub {

        .spinner {

            animation: spin 1s linear infinite;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>

    <script>
        // ===== CẤU HÌNH MOCKAPI =====
        const MOCKAPI_PROJECT_KEY = "YOUR_MOCKAPI_API_KEY_HERE";
        const MOCKAPI_URL = "https://6a8301e0cb486d2434032817.mockapi.io/chanboaydethgngheo/v1/apikeytooltx";

        // ===== DOM LOGIN =====
        const overlay = document.getElementById('login-overlay');
        const loginInput = document.getElementById('login-key-input');
        const loginBtn = document.getElementById('login-btn');
        const loginMsg = document.getElementById('login-msg');
        const saveKeyCheckbox = document.getElementById('save-key-checkbox');

        // ===== DOM WELCOME =====
        const welcomeScreen = document.getElementById('welcome-screen');

        // ===== DOM TOOL =====
        const widgetWrapper = document.getElementById('widget-wrapper');
        const toast = document.getElementById('txt-toast');
        const keyInfoDisplay = document.getElementById('key-info-display');
        const currentKeyDisplay = document.getElementById('current-key-display');
        const currentExpiryDisplay = document.getElementById('current-expiry-display');

        // ===== BIẾN TOÀN CỤC LƯU THÔNG TIN KEY =====
        let currentUserKey = null;
        let currentUserExpiry = null;

        // ===== LƯU KEY VÀO LOCALSTORAGE =====
        function saveKeyToStorage(key) {
            if (!key) return;
            localStorage.setItem('saved_tool_key', key);
            showToastMsg('✅ Đã lưu key!', false);
        }

        function getSavedKey() {
            return localStorage.getItem('saved_tool_key') || '';
        }

        function showToastMsg(msg, isError = false) {
            loginMsg.textContent = msg;
            loginMsg.className = isError ? 'login-msg' : 'login-msg success';
        }

        // ===== HIỂN THỊ THÔNG TIN KEY TRONG TOOL =====
        function updateKeyInfoDisplay(key, expiry) {
            if (key) {
                currentKeyDisplay.textContent = key.slice(0, 8) + '...' + key.slice(-4);
            } else {
                currentKeyDisplay.textContent = 'Chưa có';
            }
            if (expiry) {
                currentExpiryDisplay.textContent = expiry;
            } else {
                currentExpiryDisplay.textContent = 'Vĩnh viễn';
            }
        }

        // ===== TỰ ĐỘNG ĐIỀN KEY ĐÃ LƯU (nếu có) =====
        (function loadSavedKey() {
            const saved = getSavedKey();
            if (saved) {
                loginInput.value = saved;
                saveKeyCheckbox.checked = true;
            }
        })();

        // ===== SỰ KIỆN TICK CHECKBOX =====
        saveKeyCheckbox.addEventListener('change', function() {
            const key = loginInput.value.trim();
            if (this.checked) {
                if (key) {
                    saveKeyToStorage(key);
                } else {
                    showToastMsg('Vui Lòng Nhập Key Để Lưu', true);
                }
            } else {
                localStorage.removeItem('saved_tool_key');
                showToastMsg('🗑️ Đã xoá key đã lưu', false);
            }
        });

        // ===== HÀM KIỂM TRA KEY – TRẢ VỀ THÔNG TIN ĐẦY ĐỦ =====
        async function verifyKey(userKey) {
            if (userKey === "1") {
                return { valid: true, key: "1", expiry: null };
            }
            return { valid: false, key: null, expiry: null };
        }

        // ===== XỬ LÝ ĐĂNG NHẬP =====
        loginBtn.addEventListener('click', async () => {
            const userKey = loginInput.value.trim();
            if (!userKey) {
                showToastMsg('Vui lòng nhập key', true);
                return;
            }

            loginBtn.disabled = true;
            loginBtn.textContent = 'Đang kiểm tra...';
            loginMsg.textContent = '';
            loginMsg.className = 'login-msg';

            const result = await verifyKey(userKey);

            if (result.valid) {
                currentUserKey = result.key;
                currentUserExpiry = result.expiry;
                showToastMsg('✅ Xác thực thành công!', false);
                if (saveKeyCheckbox.checked) {
                    saveKeyToStorage(userKey);
                } else {
                    localStorage.removeItem('saved_tool_key');
                }
                setTimeout(() => {
                    overlay.classList.add('hidden');
                    welcomeScreen.classList.add('show');
                    setTimeout(() => {
                        welcomeScreen.classList.remove('show');
                        widgetWrapper.style.display = 'block';
                        toast.style.display = 'flex';
                        // Cập nhật thông tin key trên tool
                        updateKeyInfoDisplay(currentUserKey, currentUserExpiry);
                        initTool();
                    }, 2800);
                }, 400);
            } else {
                showToastMsg('❌ Key Không Tồn Tại,Vui Lòng Liên Hệ Admin.', true);
                loginBtn.disabled = false;
                loginBtn.textContent = 'Xác nhận';
                currentUserKey = null;
                currentUserExpiry = null;
            }
        });

        loginInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') loginBtn.click();
        });

        // ===== KHỞI TẠO TOOL (GIỮ NGUYÊN TOÀN BỘ THUẬT TOÁN) =====
        function initTool() {
            const TEXT_TAI = "Tài";
            const TEXT_XIU = "Xỉu";

            const startBtn = document.getElementById('start-btn');
            const exitBtn = document.getElementById('exit-btn');
            const codeInput = document.getElementById('code-input');
            const inputMsg = document.getElementById('input-msg');
            const closeWidgetBtn = document.getElementById('close-widget-btn');
            const vipBtn = document.getElementById('vip-btn');
            const telegramLink = document.getElementById('telegram-link');

            const rotateLeftBtn = document.getElementById('rotate-left-btn');
            const rotateRightBtn = document.getElementById('rotate-right-btn');
            const zoomInBtn = document.getElementById('zoom-in-btn');
            const zoomOutBtn = document.getElementById('zoom-out-btn');

            let currentRotation = 0;
            let currentScale = 1;

            function updateWidgetTransform() {
                widgetWrapper.style.transform = `rotate(${currentRotation}deg) scale(${currentScale})`;
            }

            rotateLeftBtn.addEventListener('click', () => {
                currentRotation -= 90;
                updateWidgetTransform();
            });

            rotateRightBtn.addEventListener('click', () => {
                currentRotation += 90;
                updateWidgetTransform();
            });

            zoomInBtn.addEventListener('click', () => {
                if (currentScale < 1.5) {
                    currentScale += 0.1;
                    updateWidgetTransform();
                }
            });

            zoomOutBtn.addEventListener('click', () => {
                if (currentScale > 0.6) {
                    currentScale -= 0.1;
                    updateWidgetTransform();
                }
            });

            const REQUIRED_LENGTH = 32;
            const FIXED_KEY = "Make By Van Vinh";

            let lastEvaluatedSession = "";
            let sessionResult = { isTai: true, percent: 75 };

            telegramLink.addEventListener('click', function(e) {
                e.preventDefault();
                window.location.href = "tg://resolve?domain=vanvinh10";
                setTimeout(() => {
                    window.location.href = "https://t.me/vanvinh10";
                }, 1000);
            });

            // ===== HÀM DỰ ĐOÁN – KHÔNG THAY ĐỔI =====
            function getSessionData(sessionCode) {
                let combined = sessionCode + FIXED_KEY;
                let hash = 0;
                for (let i = 0; i < combined.length; i++) {
                    hash = (hash << 5) - hash + combined.charCodeAt(i);
                    hash |= 0;
                }
                const isTai = Math.abs(hash) % 2 === 0;
                const percent = 70 + (Math.abs(hash) % 25);
                return { isTai, percent };
            }

            codeInput.addEventListener('input', () => {
                const val = codeInput.value.trim();
                if (val.length !== REQUIRED_LENGTH) {
                    inputMsg.className = 'input-msg error';
                    inputMsg.innerText = 'Chưa hợp lệ! Yêu cầu đúng ' + REQUIRED_LENGTH + ' ký tự (' + val.length + '/' + REQUIRED_LENGTH + ')';

                    document.getElementById('result').innerText = '-';
                    document.getElementById('percent').innerText = '--%';
                    document.getElementById('circle-tai').classList.remove('active');
                    document.getElementById('circle-xiu').classList.remove('active');
                    lastEvaluatedSession = "";
                } else {
                    inputMsg.className = 'input-msg success';
                    inputMsg.innerText = 'Hợp lệ! Đã nhận mã phiên.';

                    if (val !== lastEvaluatedSession) {
                        lastEvaluatedSession = val;
                        sessionResult = getSessionData(val);

                        document.getElementById('result').innerText = '-';
                        document.getElementById('percent').innerText = '--%';
                        document.getElementById('circle-tai').classList.remove('active');
                        document.getElementById('circle-xiu').classList.remove('active');
                    }
                }
            });

            startBtn.addEventListener('click', () => {
                const val = codeInput.value.trim();
                if (val.length !== REQUIRED_LENGTH) {
                    inputMsg.className = 'input-msg error';
                    inputMsg.innerText = 'Vui lòng nhập đủ 32 ký tự mã phiên trước khi bắt đầu!';
                    return;
                }

                if (lastEvaluatedSession !== val) {
                    sessionResult = getSessionData(val);
                    lastEvaluatedSession = val;
                }

                startBtn.disabled = true;
                startBtn.style.opacity = '0.6';
                startBtn.innerText = 'ĐANG XỬ LÝ...';

                document.getElementById('result').innerText = '...';
                document.getElementById('percent').innerText = '...%';

                setTimeout(() => {
                    startBtn.disabled = false;
                    startBtn.style.opacity = '1';
                    startBtn.innerText = 'BẮT ĐẦU';

                    document.getElementById('percent').innerText = sessionResult.percent + '%';

                    const resultEl = document.getElementById('result');
                    const circleTai = document.getElementById('circle-tai');
                    const circleXiu = document.getElementById('circle-xiu');

                    if (sessionResult.isTai) {
                        resultEl.innerText = TEXT_TAI;
                        circleTai.classList.add('active');
                        circleXiu.classList.remove('active');
                    } else {
                        resultEl.innerText = TEXT_XIU;
                        circleXiu.classList.add('active');
                        circleTai.classList.remove('active');
                    }
                }, 1200);
            });

            exitBtn.addEventListener('click', () => {
                codeInput.value = '';
                inputMsg.className = 'input-msg error';
                inputMsg.innerText = 'Hệ Thống Phân Tích MD5 Đã Dừng Hoạt Động';

                document.getElementById('result').innerText = '-';
                document.getElementById('percent').innerText = '--%';
                document.getElementById('circle-tai').classList.remove('active');
                document.getElementById('circle-xiu').classList.remove('active');

                lastEvaluatedSession = "";
            });

            closeWidgetBtn.addEventListener('click', () => {
                widgetWrapper.style.display = 'none';
                toast.style.display = 'none';
                vipBtn.style.display = 'block';
            });

            let isDragging = false;
            let hasDragged = false;
            let startX, startY, initialLeft, initialTop;

            function dragStart(e) {
                isDragging = true;
                hasDragged = false;

                if (e.type === "touchstart") {
                    startX = e.touches[0].clientX;
                    startY = e.touches[0].clientY;
                } else {
                    startX = e.clientX;
                    startY = e.clientY;
                }

                if (vipBtn.style.margin !== '0px') {
                    const rect = vipBtn.getBoundingClientRect();
                    vipBtn.style.margin = '0px';
                    vipBtn.style.left = rect.left + 'px';
                    vipBtn.style.top = rect.top + 'px';
                }

                initialLeft = parseFloat(vipBtn.style.left) || 0;
                initialTop = parseFloat(vipBtn.style.top) || 0;
            }

            function drag(e) {
                if (!isDragging) return;

                let currentX, currentY;
                if (e.type === "touchmove") {
                    currentX = e.touches[0].clientX;
                    currentY = e.touches[0].clientY;
                } else {
                    currentX = e.clientX;
                    currentY = e.clientY;
                }

                const dx = currentX - startX;
                const dy = currentY - startY;

                if (Math.abs(dx) > 5 || Math.abs(dy) > 5) {
                    hasDragged = true;
                }

                if (hasDragged) {
                    e.preventDefault();
                    vipBtn.style.left = (initialLeft + dx) + 'px';
                    vipBtn.style.top = (initialTop + dy) + 'px';
                }
            }

            function dragEnd() {
                isDragging = false;
            }

            vipBtn.addEventListener('mousedown', dragStart);
            vipBtn.addEventListener('touchstart', dragStart, { passive: false });

            document.addEventListener('mousemove', drag);
            document.addEventListener('touchmove', drag, { passive: false });

            document.addEventListener('mouseup', dragEnd);
            document.addEventListener('touchend', dragEnd);

            vipBtn.addEventListener('click', (e) => {
                if (hasDragged) {
                    e.preventDefault();
                    hasDragged = false;
                    return;
                }
                widgetWrapper.style.display = 'block';
                toast.style.display = 'flex';
                vipBtn.style.display = 'none';
            });
        }

        // ===== KHỞI TẠO TRANG =====
        // Mặc định overlay hiển thị
    </script>
</body>
</html>
