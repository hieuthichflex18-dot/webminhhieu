<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tool Tạo Video AI - Phong Cảnh & Avatar Dẫn Chuyện</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Roboto, sans-serif; }
        body { background-color: #090d16; color: #f1f5f9; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; }
        .container { display: flex; flex-wrap: wrap; gap: 25px; background: #111827; padding: 25px; border-radius: 20px; box-shadow: 0 20px 50px rgba(0,0,0,0.7); max-width: 1000px; width: 100%; border: 1px solid #1f2937; }
        .form-section { flex: 1.2; min-width: 320px; display: flex; flex-direction: column; gap: 14px; }
        .preview-section { flex: 0.8; min-width: 300px; display: flex; flex-direction: column; align-items: center; justify-content: center; background: #030712; padding: 20px; border-radius: 16px; border: 1px solid #1f2937; }
        
        h2 { color: #38bdf8; font-size: 1.4rem; font-weight: 700; display: flex; align-items: center; gap: 8px; }
        .input-group { display: flex; flex-direction: column; gap: 5px; }
        label { font-size: 0.85rem; color: #9ca3af; font-weight: 600; text-transform: uppercase; }
        input[type="text"], textarea, select { width: 100%; padding: 11px; border-radius: 8px; border: 1px solid #374151; background: #1f2937; color: #fff; font-size: 0.95rem; outline: none; }
        
        .row { display: flex; gap: 10px; }
        .btn-ai { background: linear-gradient(135deg, #a855f7, #6366f1); color: white; border: none; padding: 10px 14px; border-radius: 8px; font-weight: 600; cursor: pointer; white-space: nowrap; }
        .btn-primary { background: linear-gradient(135deg, #0284c7, #2563eb); color: white; border: none; padding: 14px; border-radius: 10px; font-weight: 700; font-size: 1rem; cursor: pointer; margin-top: 5px; }
        .btn-primary:disabled { background: #4b5563; cursor: not-allowed; }
        
        canvas { border-radius: 12px; box-shadow: 0 10px 30px rgba(0,0,0,0.9); background: #000; width: 100%; max-width: 310px; aspect-ratio: 9/16; }
        #downloadBtn { background: #10b981; color: white; border: none; padding: 12px; border-radius: 10px; font-weight: bold; margin-top: 15px; cursor: pointer; display: none; width: 100%; max-width: 310px; text-align: center; }
        .status { font-size: 0.85rem; color: #f59e0b; font-weight: 600; min-height: 20px; text-align: center; }
    </style>
</head>
<body>

<div class="container">
    <!-- CỘT CẤU HÌNH -->
    <div class="form-section">
        <h2>🎬 AI Video Creator Pro</h2>

        <div class="input-group">
            <label>1. Tên Sản Phẩm:</label>
            <div class="row">
                <input type="text" id="productName" placeholder="VD: Nước Hoa Cao Cấp Versailles" value="Nước Hoa Cao Cấp Versailles">
                <button class="btn-ai" onclick="generateAIScript()">🤖 Viết Mô Tả AI</button>
            </div>
        </div>

        <div class="input-group">
            <label>2. Tải Ảnh Sản Phẩm:</label>
            <input type="file" id="productImgInput" accept="image/*" onchange="loadProductImg(event)">
        </div>

        <div class="row">
            <div class="input-group" style="flex:1;">
                <label>3. Phong Cảnh Nền Video:</label>
                <select id="bgType" onchange="redrawCanvas()">
                    <option value="studio">🎙️ Studio Review Đẳng Cấp</option>
                    <option value="room">🛋️ Phòng Khách Hiện Đại</option>
                    <option value="cyber">🌆 Thành Phố Cyber Neon</option>
                    <option value="nature">🌿 Cảnh Thiên Nhiên Tươi Mát</option>
                </select>
            </div>
            <div class="input-group" style="flex:1;">
                <label>4. Người AI Dẫn Chuyện:</label>
                <select id="avatarType" onchange="redrawCanvas()">
                    <option value="female">👧 MC Nữ Reviewer (Trẻ Trung)</option>
                    <option value="male">👦 MC Nam Công Sở (Lịch Lãm)</option>
                    <option value="robot">🤖 Robot AI Thông Minh</option>
                </select>
            </div>
        </div>

        <div class="input-group">
            <label>5. Kịch Bản & Giọng Đọc:</label>
            <textarea id="scriptText" rows="4" oninput="redrawCanvas()">Nước hoa Versailles mang hương thơm sang trọng, lưu hương lên đến 12 giờ. Mùi hương cuốn hút, giúp bạn luôn tự tin nổi bật mọi lúc mọi nơi. Mua ngay hôm nay để nhận ưu đãi 30%!</textarea>
        </div>

        <button class="btn-primary" id="renderBtn" onclick="startRenderProcess()">⚡ TẠO VIDEO AI PHONG CẢNH & AVATAR</button>
        <div class="status" id="statusMsg"></div>
    </div>

    <!-- CỘT PREVIEW -->
    <div class="preview-section">
        <canvas id="videoCanvas" width="360" height="640"></canvas>
        <button id="downloadBtn" onclick="downloadVideo()">📥 TẢI VIDEO VỀ MÁY (.WEBM)</button>
    </div>
</div>

<script>
    const canvas = document.getElementById('videoCanvas');
    const ctx = canvas.getContext('2d');
    let productImg = null;
    let mediaRecorder;
    let recordedChunks = [];
    let recordedBlobUrl = null;
    let isSpeaking = false;
    let speakFrame = 0;

    // Khởi tạo Canvas ban đầu
    redrawCanvas();

    function loadProductImg(e) {
        if (e.target.files[0]) {
            const reader = new FileReader();
            reader.onload = (event) => {
                productImg = new Image();
                productImg.onload = () => redrawCanvas();
                productImg.src = event.target.result;
            };
            reader.readAsDataURL(e.target.files[0]);
        }
    }

    function generateAIScript() {
        const name = document.getElementById('productName').value.trim();
        if (!name) return alert("Vui lòng nhập tên sản phẩm!");
        
        document.getElementById('statusMsg').innerText = "🤖 AI đang soạn kịch bản...";
        setTimeout(() => {
            const scripts = [
                `Siêu phẩm ${name} đã chính thức cập bến! Thiết kế sang trọng, công dụng vượt trội cùng mức giá siêu hời. Trải nghiệm thực tế cực kỳ hài lòng, bấm vào mua ngay hôm nay nhé!`,
                `Gợi ý món đồ không thể thiếu cho bạn chính là ${name}. Chất lượng cao cấp, độ bền ấn tượng và rất dễ sử dụng. Nhận ngay ưu đãi hấp dẫn khi đặt hàng hôm nay!`,
                `Đánh giá chân thực ${name} sau khi dùng thử. Sản phẩm vượt ngoài mong đợi, mang lại sự tiện lợi tối đa. Đừng bỏ lỡ chương trình khuyến mãi đặc biệt nhé!`
            ];
            document.getElementById('scriptText').value = scripts[Math.floor(Math.random() * scripts.length)];
            document.getElementById('statusMsg').innerText = "✅ Đã tạo kịch bản!";
            redrawCanvas();
        }, 500);
    }

    // VẼ PHONG CẢNH NỀN
    function drawBackground(type) {
        if (type === 'studio') {
            let grad = ctx.createRadialGradient(180, 200, 20, 180, 320, 350);
            grad.addColorStop(0, '#3b82f6'); grad.addColorStop(0.5, '#1e3a8a'); grad.addColorStop(1, '#0f172a');
            ctx.fillStyle = grad; ctx.fillRect(0, 0, 360, 640);
            ctx.fillStyle = "rgba(255,255,255,0.05)";
            ctx.fillRect(0, 420, 360, 220); // Bàn Studio
        } else if (type === 'room') {
            let grad = ctx.createLinearGradient(0, 0, 0, 640);
            grad.addColorStop(0, '#7c2d12'); grad.addColorStop(0.6, '#1c1917'); grad.addColorStop(1, '#0c0a09');
            ctx.fillStyle = grad; ctx.fillRect(0, 0, 360, 640);
        } else if (type === 'cyber') {
            let grad = ctx.createLinearGradient(0, 0, 0, 640);
            grad.addColorStop(0, '#581c87'); grad.addColorStop(0.5, '#831843'); grad.addColorStop(1, '#09090b');
            ctx.fillStyle = grad; ctx.fillRect(0, 0, 360, 640);
        } else { // nature
            let grad = ctx.createLinearGradient(0, 0, 0, 640);
            grad.addColorStop(0, '#064e3b'); grad.addColorStop(0.6, '#022c22'); grad.addColorStop(1, '#052e16');
            ctx.fillStyle = grad; ctx.fillRect(0, 0, 360, 640);
        }
    }

    // VẼ NGƯỜI AI DẪN CHUYỆN (AVATAR CÓ CỬ ĐỘNG NHÉP MIỆNG)
    function drawAIAvatar(type, x, y, speaking) {
        ctx.save();
        ctx.translate(x, y);

        // Khung Avatar
        ctx.beginPath();
        ctx.arc(0, 0, 45, 0, Math.PI * 2);
        ctx.fillStyle = "#1e293b";
        ctx.fill();
        ctx.lineWidth = 3;
        ctx.strokeStyle = speaking ? "#38bdf8" : "#64748b";
        ctx.stroke();

        // Vẽ khuôn mặt / Nhân vật
        if (type === 'robot') {
            ctx.fillStyle = "#0284c7"; // Đầu Robot
            ctx.fillRect(-22, -22, 44, 38);
            ctx.fillStyle = "#38bdf8"; // Mắt
            ctx.fillRect(-14, -12, 8, 8); ctx.fillRect(6, -12, 8, 8);
            // Miệng Robot cử động
            ctx.fillStyle = speaking ? "#f59e0b" : "#ffffff";
            let mouthH = speaking ? (4 + Math.sin(speakFrame) * 4) : 2;
            ctx.fillRect(-10, 8, 20, mouthH);
        } else {
            // Tóc / Khuôn mặt người
            ctx.fillStyle = "#fde047"; // Mặt
            ctx.beginPath(); ctx.arc(0, 0, 24, 0, Math.PI * 2); ctx.fill();
            
            ctx.fillStyle = type === 'female' ? "#854d0e" : "#1e1b4b"; // Tóc
            ctx.beginPath(); ctx.arc(0, -6, 26, Math.PI, 0); ctx.fill();

            // Mắt
            ctx.fillStyle = "#0f172a";
            ctx.beginPath(); ctx.arc(-8, -4, 3, 0, Math.PI*2); ctx.arc(8, -4, 3, 0, Math.PI*2); ctx.fill();

            // Miệng nhép theo giọng đọc
            ctx.fillStyle = "#e11d48";
            ctx.beginPath();
            let mouthR = speaking ? (3 + Math.abs(Math.sin(speakFrame) * 5)) : 2;
            ctx.arc(0, 8, mouthR, 0, Math.PI * 2);
            ctx.fill();
        }

        ctx.restore();
    }

    // VẼ TOÀN BỘ FRAME CANVAS
    function redrawCanvas() {
        const title = document.getElementById('productName').value || "SẢN PHẨM";
        const script = document.getElementById('scriptText').value || "";
        const bgType = document.getElementById('bgType').value;
        const avatarType = document.getElementById('avatarType').value;

        // 1. Phong cảnh nền
        drawBackground(bgType);

        // 2. Tiêu đề
        ctx.fillStyle = "#f59e0b";
        ctx.font = "bold 16px Arial";
        ctx.textAlign = "center";
        ctx.fillText("🔥 SIÊU PHẨM HOT REVIEW 🔥", 180, 45);

        ctx.fillStyle = "#ffffff";
        ctx.font = "bold 18px Arial";
        wrapText(ctx, title.toUpperCase(), 180, 75, 320, 22);

        // 3. Khung Ảnh Sản Phẩm Chân Thật
        ctx.fillStyle = "rgba(0,0,0,0.5)";
        ctx.roundRect(25, 115, 310, 250, 16);
        ctx.fill();
        ctx.strokeStyle = "#38bdf8"; ctx.lineWidth = 2; ctx.stroke();

        if (productImg) {
            ctx.save();
            ctx.beginPath(); ctx.roundRect(30, 120, 300, 240, 12); ctx.clip();
            ctx.drawImage(productImg, 30, 120, 300, 240);
            ctx.restore();
        } else {
            ctx.fillStyle = "#94a3b8";
            ctx.font = "14px Arial";
            ctx.fillText("📷 (Bấm tải ảnh SP để hiển thị)", 180, 240);
        }

        // 4. Người AI Dẫn Chuyện (Avatar ở góc dưới bên trái)
        drawAIAvatar(avatarType, 65, 425, isSpeaking);

        // Label MC AI
        ctx.fillStyle = "#38bdf8";
        ctx.font = "bold 13px Arial";
        ctx.textAlign = "left";
        ctx.fillText("🎙️ MC AI Reviewer:", 120, 415);

        // 5. Khung kịch bản / Phụ đề
        ctx.fillStyle = "rgba(15, 23, 42, 0.85)";
        ctx.roundRect(20, 480, 320, 140, 12);
        ctx.fill();

        ctx.fillStyle = "#ffffff";
        ctx.font = "14px Arial";
        ctx.textAlign = "center";
        wrapText(ctx, script, 180, 510, 290, 20);
    }

    // TIẾN HÀNH TẠO VIDEO & GIỌNG NÓI
    async function startRenderProcess() {
        const script = document.getElementById('scriptText').value;
        const renderBtn = document.getElementById('renderBtn');
        const statusMsg = document.getElementById('statusMsg');
        const downloadBtn = document.getElementById('downloadBtn');

        if (!script) return alert("Vui lòng nhập kịch bản!");

        renderBtn.disabled = true;
        downloadBtn.style.display = 'none';
        statusMsg.innerText = "🎙️ Đang ghi hình & MC AI đọc kịch bản...";

        const stream = canvas.captureStream(30);
        recordedChunks = [];
        mediaRecorder = new MediaRecorder(stream, { mimeType: 'video/webm' });
        mediaRecorder.ondataavailable = e => { if (e.data.size > 0) recordedChunks.push(e.data); };
        mediaRecorder.onstop = exportVideoFile;
        mediaRecorder.start();

        window.speechSynthesis.cancel();
        const utterance = new SpeechSynthesisUtterance(script);
        utterance.lang = 'vi-VN';
        utterance.rate = 1.0;

        const voices = window.speechSynthesis.getVoices();
        const viVoice = voices.find(v => v.lang.includes('vi'));
        if (viVoice) utterance.voice = viVoice;

        isSpeaking = true;
        speakFrame = 0;
        const animInterval = setInterval(() => {
            speakFrame += 0.3;
            redrawCanvas();
        }, 50);

        utterance.onend = () => {
            clearInterval(animInterval);
            isSpeaking = false;
            redrawCanvas();
            setTimeout(() => {
                mediaRecorder.stop();
                renderBtn.disabled = false;
                statusMsg.innerText = "✅ Hoàn tất! Video đã sẵn sàng tải xuống.";
            }, 500);
        };

        window.speechSynthesis.speak(utterance);
    }

    function exportVideoFile() {
        const blob = new Blob(recordedChunks, { type: 'video/webm' });
        recordedBlobUrl = URL.createObjectURL(blob);
        document.getElementById('downloadBtn').style.display = 'block';
    }

    function downloadVideo() {
        if (recordedBlobUrl) {
            const a = document.createElement('a');
            a.href = recordedBlobUrl;
            a.download = `review-ai-${Date.now()}.webm`;
            a.click();
        }
    }

    function wrapText(context, text, x, y, maxWidth, lineHeight) {
        if (!text) return;
        const words = text.split(' ');
        let line = '';
        for(let n = 0; n < words.length; n++) {
            let testLine = line + words[n] + ' ';
            if (context.measureText(testLine).width > maxWidth && n > 0) {
                context.fillText(line, x, y);
                line = words[n] + ' ';
                y += lineHeight;
            } else { line = testLine; }
        }
        context.fillText(line, x, y);
    }

    if (!ctx.roundRect) {
        ctx.roundRect = function(x, y, w, h, r) {
            this.beginPath(); this.moveTo(x+r, y);
            this.arcTo(x+w, y, x+w, y+h, r); this.arcTo(x+w, y+h, x, y+h, r);
            this.arcTo(x, y+h, x, y, r); this.arcTo(x, y, x+w, y, r);
            this.closePath(); return this;
        };
    }
</script>
</body>
</html>
