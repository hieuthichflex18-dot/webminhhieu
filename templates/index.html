<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MH Predictor · Dự đoán Tài Xỉu</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<div class="bg-fx"></div>
<div class="orb b"></div>
<div class="orb c"></div>
<div class="orb v"></div>

<div class="wrap">
  <nav class="nav" id="nav">
    <div class="brand">
      <div class="brand-logo">⚡</div>
      <div class="brand-name">MH PREDICTOR</div>
    </div>
    <div class="nav-links">
      <a href="/" class="nav-link active">Trang chủ</a>
      {% if role == 'admin' %}
      <a href="/admin" class="nav-link">Admin</a>
      {% endif %}
      <a href="/logout" class="nav-link">Đăng xuất</a>
    </div>
    <div class="nav-user">
      <div class="avatar">{{ username[0].upper() }}</div>
      <span>{{ username }}</span>
      <span class="tier-badge {{ 'admin' if role == 'admin' }}">{{ tier }}</span>
    </div>
  </nav>

  <h1 class="page-title">Bảng điều khiển dự đoán</h1>
  <p class="page-sub">Chọn nhà cái để xem phiên hiện tại và dự đoán phiên tiếp theo</p>

  <div class="games-grid" id="gamesGrid">
    <div class="empty-state" style="grid-column: 1/-1;">
      <div class="icon">⏳</div>
      <div>Đang tải danh sách game...</div>
    </div>
  </div>

  <div id="dualPanel" class="dual-panel" style="display:none;"></div>
</div>

<script src="/static/app.js"></script>
</body>
</html>
